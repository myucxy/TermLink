# Opt-in host port for private-LAN Android/Windows TLS acceptance runs. The
# default public deployment keeps Lucky's internal TLS loopback private while
# exposing only its HTTP upstream to the host reverse proxy.
services:
  lucky-upstream:
    ports:
      - "${TERMLINK_ACCEPTANCE_EDGE_BIND_IP:-127.0.0.1}:9443:9443"
