# Explicit one-Server production overlay. PostgreSQL is the only external
# stateful service; identity, migrations, coordination, Relay and Direct/NAT
# signalling run inside TermLink Server. Do not scale the server beyond one
# replica with this overlay.
services:
  migrate:
    profiles: ["distributed-runtime"]

  valkey:
    profiles: ["distributed-runtime"]

  server:
    environment:
      TERMLINK_RUNTIME_MODE: single-node
      TERMLINK_IDENTITY_PROVIDER: embedded
      TERMLINK_DIRECT_TRANSPORT_ENABLED: "true"
      TERMLINK_DIRECT_ROUTING_PERMITTED: ${TERMLINK_DIRECT_ROUTING_PERMITTED:-false}
      TERMLINK_DIRECT_STUN_SERVERS: ${TERMLINK_DIRECT_STUN_SERVERS:-stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302}
      TERMLINK_REDIS_URL_FILE: !reset null
      TERMLINK_DIRECT_REDIS_URL_FILE: !reset null
    secrets: !override
      - source: database_url
        target: database_url
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: token_signing_key
        target: token_signing_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    depends_on: !override
      postgres:
        condition: service_healthy
