name: ${COMPOSE_PROJECT_NAME:-termlink}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}

services:
  edge:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      TERMLINK_PUBLIC_HOST: ${TERMLINK_PUBLIC_HOST:-localhost}
      TERMLINK_ACME_CA: ${TERMLINK_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # Keep headless core rendering independent from the optional edge
      # profile. Caddy and the production policy both fail closed when edge is
      # selected without a real contact address.
      TERMLINK_ACME_EMAIL: ${TERMLINK_ACME_EMAIL:-}
    ports:
      - "${TERMLINK_EDGE_BIND_IP:-0.0.0.0}:443:8443"
    networks:
      - public
      - frontend
    volumes:
      # Core serves only the application. The history overlay replaces this
      # target with the object-aware Caddyfile and adds the isolated network.
      - ./external-services.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${TERMLINK_EDGE_MEMORY_LIMIT:-256m}
    mem_reservation: ${TERMLINK_EDGE_MEMORY_RESERVATION:-64m}
    cpus: ${TERMLINK_EDGE_CPU_LIMIT:-0.50}
    pids_limit: ${TERMLINK_EDGE_PIDS_LIMIT:-128}
    logging: *default-logging
    restart: unless-stopped
    profiles: ["edge"]

  migrate:
    image: ${TERMLINK_IMAGE:?TERMLINK_IMAGE immutable tag@sha256 digest is required}
    command: ["migrate"]
    environment: &server-environment
      TERMLINK_PUBLIC_URL: ${TERMLINK_PUBLIC_URL:?TERMLINK_PUBLIC_URL is required}
      TERMLINK_OIDC_ISSUER: ${TERMLINK_OIDC_ISSUER:?TERMLINK_OIDC_ISSUER is required}
      TERMLINK_OIDC_CLIENT_ID: ${TERMLINK_OIDC_CLIENT_ID:?TERMLINK_OIDC_CLIENT_ID is required}
      TERMLINK_OIDC_ALLOWED_PARTIES: ${TERMLINK_OIDC_ALLOWED_PARTIES:-termlink-android,termlink-windows}
      TERMLINK_ANDROID_OIDC_CLIENT_ID: ${TERMLINK_ANDROID_OIDC_CLIENT_ID:-termlink-android}
      TERMLINK_ANDROID_OIDC_REDIRECT_URI: ${TERMLINK_ANDROID_OIDC_REDIRECT_URI:-dev.termlink:/oauth2redirect}
      TERMLINK_WINDOWS_OIDC_CLIENT_ID: ${TERMLINK_WINDOWS_OIDC_CLIENT_ID:-termlink-windows}
      TERMLINK_WINDOWS_REGISTRATION_OIDC_PARTIES: ${TERMLINK_WINDOWS_REGISTRATION_OIDC_PARTIES:-termlink-windows}
      TERMLINK_WINDOWS_OIDC_REDIRECT_URI: ${TERMLINK_WINDOWS_OIDC_REDIRECT_URI:-http://127.0.0.1/oauth2/callback}
      TERMLINK_WEB_OIDC_CLIENT_ID: ${TERMLINK_WEB_OIDC_CLIENT_ID:-termlink-web}
      TERMLINK_WEB_STEP_UP_OIDC_CLIENT_ID: ${TERMLINK_WEB_STEP_UP_OIDC_CLIENT_ID:-termlink-web-step-up}
      TERMLINK_WEB_OIDC_REDIRECT_URI: ${TERMLINK_WEB_OIDC_REDIRECT_URI:-}
      TERMLINK_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # Migrations share this environment anchor but never need identity-admin
      # authority. The Keycloak registration/recovery overlay enables the
      # bounded account-creation client only on the server.
      TERMLINK_REGISTRATION_RECOVERY_ENABLED: "false"
      TERMLINK_ACCOUNT_DELETION_ENABLED: "false"
      TERMLINK_DATABASE_URL_FILE: /run/secrets/database_url
      TERMLINK_REDIS_URL_FILE: /run/secrets/redis_url
      TERMLINK_TOKEN_SIGNING_KEY_FILE: /run/secrets/token_signing_key
      TERMLINK_POSTGRES_MAX_CONNS: ${TERMLINK_POSTGRES_MAX_CONNS:-20}
      TERMLINK_POSTGRES_MIN_CONNS: ${TERMLINK_POSTGRES_MIN_CONNS:-2}
      TERMLINK_POSTGRES_MAX_CONN_LIFETIME: ${TERMLINK_POSTGRES_MAX_CONN_LIFETIME:-30m}
      TERMLINK_POSTGRES_MAX_CONN_IDLE_TIME: ${TERMLINK_POSTGRES_MAX_CONN_IDLE_TIME:-5m}
      TERMLINK_POSTGRES_HEALTH_CHECK_PERIOD: ${TERMLINK_POSTGRES_HEALTH_CHECK_PERIOD:-1m}
      TERMLINK_POSTGRES_CONNECT_TIMEOUT: ${TERMLINK_POSTGRES_CONNECT_TIMEOUT:-5s}
      TERMLINK_REDIS_POOL_SIZE: ${TERMLINK_REDIS_POOL_SIZE:-20}
      TERMLINK_REDIS_MIN_IDLE_CONNS: ${TERMLINK_REDIS_MIN_IDLE_CONNS:-2}
      TERMLINK_REDIS_DIAL_TIMEOUT: ${TERMLINK_REDIS_DIAL_TIMEOUT:-5s}
      TERMLINK_REDIS_READ_TIMEOUT: ${TERMLINK_REDIS_READ_TIMEOUT:-3s}
      TERMLINK_REDIS_WRITE_TIMEOUT: ${TERMLINK_REDIS_WRITE_TIMEOUT:-3s}
      TERMLINK_REDIS_POOL_TIMEOUT: ${TERMLINK_REDIS_POOL_TIMEOUT:-4s}
      TERMLINK_LOG_LEVEL: ${TERMLINK_LOG_LEVEL:-info}
      TERMLINK_HISTORY_ENABLED: "false"
      TERMLINK_LISTEN_ADDR: :8080
    secrets: &server-secrets
      - source: oidc_client_secret
        target: oidc_client_secret
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: database_url
        target: database_url
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: redis_url
        target: redis_url
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: token_signing_key
        target: token_signing_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    networks:
      - backend
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${TERMLINK_MIGRATE_MEMORY_LIMIT:-256m}
    mem_reservation: ${TERMLINK_MIGRATE_MEMORY_RESERVATION:-64m}
    cpus: ${TERMLINK_MIGRATE_CPU_LIMIT:-0.50}
    pids_limit: ${TERMLINK_MIGRATE_PIDS_LIMIT:-128}
    logging: *default-logging
    restart: "no"

  server:
    image: ${TERMLINK_IMAGE:?TERMLINK_IMAGE immutable tag@sha256 digest is required}
    environment:
      <<: *server-environment
      TERMLINK_APPSHIP_BASE_URL: ${TERMLINK_APPSHIP_BASE_URL:-https://appship.kget.cc:8910}
      TERMLINK_APPSHIP_ALLOWED_PRIVATE_IPS: ${TERMLINK_APPSHIP_ALLOWED_PRIVATE_IPS:-}
    secrets: *server-secrets
    networks:
      - frontend
      - backend
      - egress
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/termlink-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${TERMLINK_SERVER_MEMORY_LIMIT:-512m}
    mem_reservation: ${TERMLINK_SERVER_MEMORY_RESERVATION:-128m}
    cpus: ${TERMLINK_SERVER_CPU_LIMIT:-1.00}
    pids_limit: ${TERMLINK_SERVER_PIDS_LIMIT:-256}
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-termlink}
      POSTGRES_USER: ${POSTGRES_USER:-termlink}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
        mode: 0400
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: ${TERMLINK_POSTGRES_SHM_SIZE:-128m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${TERMLINK_POSTGRES_MEMORY_LIMIT:-1g}
    mem_reservation: ${TERMLINK_POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${TERMLINK_POSTGRES_CPU_LIMIT:-1.50}
    pids_limit: ${TERMLINK_POSTGRES_PIDS_LIMIT:-256}
    logging: *default-logging
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.1-alpine@sha256:6a57d58c0a37cf7acc3045ac0fd6dd91be339774106ab4d9ca088013a096a99f
    environment:
      TERMLINK_VALKEY_MAXMEMORY: ${TERMLINK_VALKEY_MAXMEMORY:-384mb}
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/valkey_password)"
        test -n "$$password"
        case "$$password" in *[!A-Za-z0-9_-]*) exit 1;; esac
        maxmemory="$${TERMLINK_VALKEY_MAXMEMORY}"
        case "$$maxmemory" in ''|*[!0-9kKmMgGtTbB]*) exit 1;; esac
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$password" > /run/valkey/users.acl
        unset password
        exec valkey-server --appendonly yes --aclfile /run/valkey/users.acl \
          --maxmemory "$$maxmemory" --maxmemory-policy noeviction
    secrets:
      - source: valkey_password
        target: valkey_password
        uid: "999"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    volumes:
      - valkey-data:/data
    read_only: true
    user: "999:1000"
    tmpfs:
      - /run/valkey:rw,noexec,nosuid,size=1m,uid=999,gid=1000,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli --user default ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: ${TERMLINK_VALKEY_MEMORY_LIMIT:-512m}
    mem_reservation: ${TERMLINK_VALKEY_MEMORY_RESERVATION:-128m}
    cpus: ${TERMLINK_VALKEY_CPU_LIMIT:-0.50}
    pids_limit: ${TERMLINK_VALKEY_PIDS_LIMIT:-128}
    logging: *default-logging
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:

secrets:
  oidc_client_secret:
    file: ${TERMLINK_OIDC_CLIENT_SECRET_FILE:-../secrets/oidc-client-secret}
  database_url:
    file: ${TERMLINK_DATABASE_URL_FILE:-../secrets/database-url}
  redis_url:
    file: ${TERMLINK_REDIS_URL_FILE:-../secrets/redis-url}
  token_signing_key:
    file: ${TERMLINK_TOKEN_SIGNING_KEY_FILE:-../secrets/token-signing-key}
  postgres_password:
    file: ${TERMLINK_POSTGRES_PASSWORD_FILE:-../secrets/postgres-password}
  valkey_password:
    file: ${TERMLINK_VALKEY_PASSWORD_FILE:-../secrets/valkey-password}

networks:
  public:
  # The edge and application share only this internal network.  Keeping it
  # separate from backend prevents the public proxy from reaching stateful
  # services even if a route is misconfigured.
  frontend:
    internal: true
  backend:
    internal: true
  # Only the application needs outbound access for external OIDC and S3
  # providers.  It is deliberately separate from both frontend and backend.
  egress:
