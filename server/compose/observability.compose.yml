name: ${COMPOSE_PROJECT_NAME:-termlink}

services:
  server:
    environment:
      # Keep the metrics listener separate from the edge-facing HTTP listener.
      TERMLINK_METRICS_LISTEN_ADDR: ${TERMLINK_METRICS_LISTEN_ADDR:-:9090}

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${TERMLINK_PROMETHEUS_RETENTION:-15d}
    networks:
      - frontend
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      server:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      blackbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${TERMLINK_PROMETHEUS_MEMORY_LIMIT:-1g}
    mem_reservation: ${TERMLINK_PROMETHEUS_MEMORY_RESERVATION:-256m}
    cpus: ${TERMLINK_PROMETHEUS_CPU_LIMIT:-1.00}
    pids_limit: ${TERMLINK_PROMETHEUS_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}
    stop_grace_period: 30s
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    networks:
      - frontend
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/blackbox_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${TERMLINK_BLACKBOX_MEMORY_LIMIT:-128m}
    mem_reservation: ${TERMLINK_BLACKBOX_MEMORY_RESERVATION:-32m}
    cpus: ${TERMLINK_BLACKBOX_CPU_LIMIT:-0.25}
    pids_limit: ${TERMLINK_BLACKBOX_PIDS_LIMIT:-64}
    logging:
      driver: json-file
      options:
        max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${TERMLINK_ALERTMANAGER_BIND_IP:-127.0.0.1}:${TERMLINK_ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - frontend
      - egress
    volumes:
      - alertmanager-data:/alertmanager
      - ${TERMLINK_ALERTMANAGER_CONFIG_FILE:?TERMLINK_ALERTMANAGER_CONFIG_FILE is required for observability}:/etc/alertmanager/alertmanager.yml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${TERMLINK_ALERTMANAGER_MEMORY_LIMIT:-256m}
    mem_reservation: ${TERMLINK_ALERTMANAGER_MEMORY_RESERVATION:-64m}
    cpus: ${TERMLINK_ALERTMANAGER_CPU_LIMIT:-0.50}
    pids_limit: ${TERMLINK_ALERTMANAGER_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}
    stop_grace_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    ports:
      - "${TERMLINK_GRAFANA_BIND_IP:-127.0.0.1}:${TERMLINK_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${TERMLINK_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /tmp/grafana
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
        uid: "472"
        gid: "472"
        mode: 0400
    networks:
      - frontend
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${TERMLINK_GRAFANA_MEMORY_LIMIT:-512m}
    mem_reservation: ${TERMLINK_GRAFANA_MEMORY_RESERVATION:-128m}
    cpus: ${TERMLINK_GRAFANA_CPU_LIMIT:-1.00}
    pids_limit: ${TERMLINK_GRAFANA_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ${TERMLINK_GRAFANA_ADMIN_PASSWORD_FILE:?TERMLINK_GRAFANA_ADMIN_PASSWORD_FILE is required for observability}
