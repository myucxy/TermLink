services:
  server:
    environment:
      # Direct signaling remains an optional lane. A Direct state failure must
      # degrade this process to Relay-only; it must never gate Relay startup.
      TERMLINK_DIRECT_TRANSPORT_ENABLED: "true"
      TERMLINK_DIRECT_REDIS_URL_FILE: /run/secrets/direct_redis_url
      TERMLINK_DIRECT_STUN_SERVERS: ${TERMLINK_DIRECT_STUN_SERVERS:?TERMLINK_DIRECT_STUN_SERVERS is required}
    secrets:
      - source: direct_redis_url
        target: direct_redis_url
        uid: "65532"
        gid: "65532"
        mode: 0400
    networks:
      - direct-state

  direct-valkey:
    image: valkey/valkey:8.1.1-alpine@sha256:6a57d58c0a37cf7acc3045ac0fd6dd91be339774106ab4d9ca088013a096a99f
    environment:
      TERMLINK_DIRECT_VALKEY_MAXMEMORY: ${TERMLINK_DIRECT_VALKEY_MAXMEMORY:-96mb}
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/direct_valkey_password)"
        test -n "$$password"
        case "$$password" in *[!A-Za-z0-9_-]*) exit 1;; esac
        maxmemory="$${TERMLINK_DIRECT_VALKEY_MAXMEMORY}"
        case "$$maxmemory" in ''|*[!0-9kKmMgGtTbB]*) exit 1;; esac
        umask 077
        printf 'user default off\nuser termlink-direct on >%s ~termlink:direct:v1:* ~proof:* &termlink:direct:v1:mailbox:* +hello +ping +client|setinfo +get +set +del +exists +incr +psetex +pexpire +pexpireat +hget +hset +hexists +hincrby +zadd +zcard +zrem +zremrangebyscore +time +publish +subscribe +unsubscribe +eval +evalsha\n' "$$password" > /run/valkey/users.acl
        unset password
        exec valkey-server --appendonly yes --aclfile /run/valkey/users.acl \
          --maxmemory "$$maxmemory" --maxmemory-policy noeviction
    secrets:
      - source: direct_valkey_password
        target: direct_valkey_password
        uid: "999"
        gid: "1000"
        mode: 0400
    networks:
      - direct-state
    volumes:
      - direct-valkey-data:/data
    read_only: true
    user: "999:1000"
    tmpfs:
      - /run/valkey:rw,noexec,nosuid,size=1m,uid=999,gid=1000,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/direct_valkey_password)\" valkey-cli --user termlink-direct ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: ${TERMLINK_DIRECT_VALKEY_MEMORY_LIMIT:-128m}
    mem_reservation: ${TERMLINK_DIRECT_VALKEY_MEMORY_RESERVATION:-32m}
    cpus: ${TERMLINK_DIRECT_VALKEY_CPU_LIMIT:-0.25}
    pids_limit: ${TERMLINK_DIRECT_VALKEY_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: ${TERMLINK_CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${TERMLINK_CONTAINER_LOG_MAX_FILES:-5}
    restart: unless-stopped

volumes:
  direct-valkey-data:

secrets:
  direct_redis_url:
    file: ${TERMLINK_DIRECT_REDIS_URL_FILE:?TERMLINK_DIRECT_REDIS_URL_FILE is required}
  direct_valkey_password:
    file: ${TERMLINK_DIRECT_VALKEY_PASSWORD_FILE:?TERMLINK_DIRECT_VALKEY_PASSWORD_FILE is required}

networks:
  direct-state:
    internal: true
