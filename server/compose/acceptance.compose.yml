name: termlink-production-acceptance

services:
  lucky-upstream:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${TERMLINK_ACCEPTANCE_LUCKY_BIND_IP:-0.0.0.0}:${TERMLINK_ACCEPTANCE_LUCKY_PORT:-8080}:8080"
    environment:
      TERMLINK_ACCEPTANCE_PUBLIC_HOST: ${TERMLINK_ACCEPTANCE_PUBLIC_HOST:-termlink.kget.cc}
      TERMLINK_ACCEPTANCE_PUBLIC_PORT: ${TERMLINK_ACCEPTANCE_PUBLIC_PORT:-8910}
      TERMLINK_ACCEPTANCE_PUBLIC_SCHEME: ${TERMLINK_ACCEPTANCE_PUBLIC_SCHEME:-https}
    networks:
      public:
      frontend:
      object:
    volumes:
      - ../acceptance/LuckyUpstream.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__termlink_upstream_health"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      keycloak-init:
        condition: service_completed_successfully

  edge:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${TERMLINK_ACCEPTANCE_EDGE_BIND_IP:-127.0.0.1}:9443:9443"
    environment:
      TERMLINK_ACCEPTANCE_PUBLIC_HOST: ${TERMLINK_ACCEPTANCE_PUBLIC_HOST:-termlink.kget.cc}
      TERMLINK_ACCEPTANCE_PUBLIC_PORT: ${TERMLINK_ACCEPTANCE_PUBLIC_PORT:-8910}
      TERMLINK_ACCEPTANCE_HISTORY_HOST: ${TERMLINK_ACCEPTANCE_HISTORY_HOST:-history.127.0.0.1.sslip.io}
    networks:
      public:
      frontend:
        aliases:
          - api.127.0.0.1.sslip.io
          - id.127.0.0.1.sslip.io
          - ${TERMLINK_ACCEPTANCE_PUBLIC_HOST:-termlink.kget.cc}
      object:
        aliases:
          - ${TERMLINK_ACCEPTANCE_HISTORY_HOST:-history.127.0.0.1.sslip.io}
    volumes:
      - ../acceptance/Caddyfile:/etc/caddy/Caddyfile:ro
      - acceptance-caddy-data:/data
      - acceptance-caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Docker Desktop exposes file-backed Compose secrets with host-derived
  # permissions and ignores uid/gid/mode metadata. Copy them once into
  # service-private volumes so the production-mode acceptance stack verifies
  # the permissions that each runtime actually observes.
  runtime-secrets-init:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        copy_secret() {
          source="$$1"
          destination="$$2"
          owner="$$3"
          rm -f "$$destination"
          cp "/run/secrets/$$source" "$$destination"
          chmod 0400 "$$destination"
          chown "$$owner" "$$destination"
        }
        copy_secret keycloak_admin_password /target/keycloak-runtime/keycloak_admin_password 1000:0
        copy_secret keycloak_admin_password /target/keycloak-init/keycloak_admin_password 1000:0
        copy_secret admin_initial_password /target/keycloak-init/admin_initial_password 1000:0
        copy_secret acceptance_user_password /target/keycloak-init/acceptance_user_password 1000:0
        copy_secret postgres_password /target/postgres/postgres_password 70:70
        copy_secret valkey_password /target/valkey/valkey_password 999:1000
        copy_secret s3_access_key /target/minio/s3_access_key 0:0
        copy_secret s3_secret_key /target/minio/s3_secret_key 0:0
        rm -f /target/server/keycloak_admin_client_secret
        : > /target/server/keycloak_admin_client_secret
        chmod 0600 /target/server/keycloak_admin_client_secret
        chown 1000:0 /target/server/keycloak_admin_client_secret
    secrets:
      - keycloak_admin_password
      - admin_initial_password
      - acceptance_user_password
      - postgres_password
      - valkey_password
      - s3_access_key
      - s3_secret_key
    volumes:
      - acceptance-keycloak-runtime-secrets:/target/keycloak-runtime
      - acceptance-keycloak-init-secrets:/target/keycloak-init
      - acceptance-postgres-secrets:/target/postgres
      - acceptance-valkey-secrets:/target/valkey
      - acceptance-minio-secrets:/target/minio
      - acceptance-server-secrets:/target/server
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  keycloak:
    image: termlink-production-acceptance-keycloak:local
    build:
      context: ..
      dockerfile: acceptance/Keycloak.Dockerfile
      args:
        KEYCLOAK_BASE_IMAGE: ${TERMLINK_ACCEPTANCE_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3.2@sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        rm -rf /opt/keycloak/data/tmp/kc-gzip-cache;
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: acceptance-admin
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      KC_HOSTNAME: ${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      # The acceptance realm is intentionally small. Bound the JVM heap so a
      # disposable identity provider cannot expand to the Docker host limit.
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=45
    networks: ["frontend"]
    volumes:
      - ../acceptance/keycloak-realm.json:/opt/keycloak/data/import/termlink-realm.json:ro
      - acceptance-keycloak-data:/opt/keycloak/data
      - acceptance-keycloak-runtime-secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          response="$$(cat <&3)";
          [[ "$$response" == *'"status": "UP"'* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-init:
    image: termlink-production-acceptance-keycloak:local
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        admin_password="$$(cat /run/secrets/keycloak_admin_password)"
        initial_admin_password="$$(cat /run/secrets/admin_initial_password)"
        user_password="$$(cat /run/secrets/acceptance_user_password)"
        for attempt in $$(seq 1 90); do
          if /opt/keycloak/bin/kcadm.sh config credentials \
            --config /tmp/kcadm.config \
            --server http://keycloak:8080 \
            --realm master \
            --user acceptance-admin \
            --password "$$admin_password" >/dev/null 2>&1; then
            break
          fi
          test "$$attempt" -lt 90 || exit 1
          sleep 1
        done
        /opt/keycloak/bin/kcadm.sh update realms/termlink \
          --config /tmp/kcadm.config \
          -s displayName=TermLink \
          -s loginTheme=termlink-01b-v18 \
          -s accountTheme=termlink-01b-v18 \
          -s internationalizationEnabled=true \
          -s 'supportedLocales=["zh-CN","en"]' \
          -s defaultLocale=zh-CN \
          -s rememberMe=true \
          -s registrationAllowed=false \
          -s verifyEmail=false \
          -s resetPasswordAllowed=false \
          -s bruteForceProtected=true \
          -s accessTokenLifespan=300 \
          -s accessTokenLifespanForImplicitFlow=300 \
          -s ssoSessionIdleTimeout=1800 \
          -s ssoSessionMaxLifespan=28800 \
          -s revokeRefreshToken=true \
          -s refreshTokenMaxReuse=0 >/dev/null
        for role_name in SUPER_ADMIN ADMIN AUDITOR USER TERMLINK_BOOTSTRAP_MANAGED_V1; do
          if ! /opt/keycloak/bin/kcadm.sh get "roles/$$role_name" \
            --config /tmp/kcadm.config -r termlink >/dev/null 2>&1; then
            /opt/keycloak/bin/kcadm.sh create roles \
              --config /tmp/kcadm.config -r termlink \
              -s name="$$role_name" >/dev/null
          fi
        done
        registration_scope_table=$$(/opt/keycloak/bin/kcadm.sh get client-scopes \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        registration_scope_id=$$(printf '%s\n' "$$registration_scope_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-registration-attempt; then printf '%s' "$$id"; fi
        done)
        if test -z "$$registration_scope_id"; then
          registration_scope_id=$$(/opt/keycloak/bin/kcadm.sh create client-scopes \
            --config /tmp/kcadm.config -r termlink \
            -s name=termlink-registration-attempt \
            -s protocol=openid-connect -i)
        fi
        /opt/keycloak/bin/kcadm.sh update "client-scopes/$$registration_scope_id" \
          --config /tmp/kcadm.config -r termlink \
          -s 'attributes={"include.in.token.scope":"false","display.on.consent.screen":"false"}' >/dev/null
        /opt/keycloak/bin/kcadm.sh update realms/termlink/users/profile \
          --config /tmp/kcadm.config \
          -f /opt/keycloak/data/import/termlink-user-profile.json >/dev/null
        native_flow_table=$$(/opt/keycloak/bin/kcadm.sh get authentication/flows \
          --config /tmp/kcadm.config -r termlink \
          --fields id,alias --format csv --noquotes)
        native_flow_id=$$(printf '%s\n' "$$native_flow_table" | while IFS=, read -r id alias; do
          if test "$$alias" = termlink-native-browser; then printf '%s' "$$id"; fi
        done)
        if test -z "$$native_flow_id"; then
          native_flow_id=$$(/opt/keycloak/bin/kcadm.sh create authentication/flows \
            --config /tmp/kcadm.config -r termlink -i \
            -s alias=termlink-native-browser -s providerId=basic-flow \
            -s topLevel=true -s builtIn=false)
          /opt/keycloak/bin/kcadm.sh create \
            authentication/flows/termlink-native-browser/executions/execution \
            --config /tmp/kcadm.config -r termlink -s provider=auth-cookie >/dev/null
          /opt/keycloak/bin/kcadm.sh create \
            authentication/flows/termlink-native-browser/executions/flow \
            --config /tmp/kcadm.config -r termlink \
            -s alias=termlink-native-forms -s type=basic-flow >/dev/null
          /opt/keycloak/bin/kcadm.sh create \
            authentication/flows/termlink-native-forms/executions/execution \
            --config /tmp/kcadm.config -r termlink \
            -s provider=auth-username-password-form >/dev/null
        fi
        native_execution_table=$$(/opt/keycloak/bin/kcadm.sh get \
          authentication/flows/termlink-native-browser/executions \
          --config /tmp/kcadm.config -r termlink \
          --fields id,displayName,level --format csv --noquotes)
        native_cookie_execution=$$(printf '%s\n' "$$native_execution_table" | while IFS=, read -r id name level; do
          if test "$$name" = Cookie -a "$$level" = 0; then printf '%s' "$$id"; fi
        done)
        native_forms_execution=$$(printf '%s\n' "$$native_execution_table" | while IFS=, read -r id name level; do
          if test "$$name" = termlink-native-forms -a "$$level" = 0; then printf '%s' "$$id"; fi
        done)
        test -n "$$native_flow_id" -a -n "$$native_cookie_execution" -a -n "$$native_forms_execution"
        /opt/keycloak/bin/kcadm.sh update \
          authentication/flows/termlink-native-browser/executions \
          --config /tmp/kcadm.config -r termlink -n \
          -s id="$$native_cookie_execution" -s requirement=ALTERNATIVE >/dev/null
        /opt/keycloak/bin/kcadm.sh update \
          authentication/flows/termlink-native-browser/executions \
          --config /tmp/kcadm.config -r termlink -n \
          -s id="$$native_forms_execution" -s requirement=ALTERNATIVE >/dev/null
        step_up_flow_id=$$(printf '%s\n' "$$native_flow_table" | while IFS=, read -r id alias; do
          if test "$$alias" = termlink-web-mfa-step-up; then printf '%s' "$$id"; fi
        done)
        if test -z "$$step_up_flow_id"; then
          step_up_flow_id=$$(/opt/keycloak/bin/kcadm.sh create authentication/flows \
            --config /tmp/kcadm.config -r termlink -i \
            -s alias=termlink-web-mfa-step-up -s providerId=basic-flow \
            -s topLevel=true -s builtIn=false \
            -s 'description=Same-account Web high-risk verification: existing SSO identity followed directly by OTP.')
          /opt/keycloak/bin/kcadm.sh create \
            authentication/flows/termlink-web-mfa-step-up/executions/execution \
            --config /tmp/kcadm.config -r termlink -s provider=auth-cookie >/dev/null
          /opt/keycloak/bin/kcadm.sh create \
            authentication/flows/termlink-web-mfa-step-up/executions/execution \
            --config /tmp/kcadm.config -r termlink -s provider=auth-otp-form >/dev/null
        fi
        step_up_execution_table=$$(/opt/keycloak/bin/kcadm.sh get \
          authentication/flows/termlink-web-mfa-step-up/executions \
          --config /tmp/kcadm.config -r termlink \
          --fields id,displayName,level --format csv --noquotes)
        step_up_cookie_execution=$$(printf '%s\n' "$$step_up_execution_table" | while IFS=, read -r id name level; do
          if test "$$name" = Cookie -a "$$level" = 0; then printf '%s' "$$id"; fi
        done)
        step_up_otp_execution=$$(printf '%s\n' "$$step_up_execution_table" | while IFS=, read -r id name level; do
          if test "$$name" = 'OTP Form' -a "$$level" = 0; then printf '%s' "$$id"; fi
        done)
        test -n "$$step_up_flow_id" -a -n "$$step_up_cookie_execution" -a -n "$$step_up_otp_execution"
        /opt/keycloak/bin/kcadm.sh update \
          authentication/flows/termlink-web-mfa-step-up/executions \
          --config /tmp/kcadm.config -r termlink -n \
          -s id="$$step_up_cookie_execution" -s requirement=REQUIRED >/dev/null
        /opt/keycloak/bin/kcadm.sh update \
          authentication/flows/termlink-web-mfa-step-up/executions \
          --config /tmp/kcadm.config -r termlink -n \
          -s id="$$step_up_otp_execution" -s requirement=REQUIRED >/dev/null
        android_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-android \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$android_client_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$android_client_id" \
          --config /tmp/kcadm.config -r termlink \
          -s publicClient=true \
          -s standardFlowEnabled=true \
          -s directAccessGrantsEnabled=true \
          -s implicitFlowEnabled=false \
          -s serviceAccountsEnabled=false \
          -s fullScopeAllowed=false \
          -s 'redirectUris=["dev.termlink:/oauth2redirect"]' \
          -s "authenticationFlowBindingOverrides={\"browser\":\"$$native_flow_id\"}" \
          -s 'attributes={"pkce.code.challenge.method":"S256"}' >/dev/null
        # This scope must stay optional. RegisterAttempt requests it only for
        # the create-account flow, while normal tokens and Account Console do
        # not receive or reveal the controlled recovery fields.
        /opt/keycloak/bin/kcadm.sh delete \
          "clients/$$android_client_id/default-client-scopes/$$registration_scope_id" \
          --config /tmp/kcadm.config -r termlink >/dev/null 2>&1 || true
        /opt/keycloak/bin/kcadm.sh update \
          "clients/$$android_client_id/optional-client-scopes/$$registration_scope_id" \
          --config /tmp/kcadm.config -r termlink >/dev/null
        cat > /tmp/termlink-android-audience.json <<'JSON'
        {
          "name": "termlink-server-audience",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "consentRequired": false,
          "config": {
            "included.client.audience": "termlink-server",
            "access.token.claim": "true",
            "id.token.claim": "false"
          }
        }
        JSON
        android_mapper_table=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$android_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        android_mapper_id=$$(printf '%s\n' "$$android_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-server-audience; then printf '%s' "$$id"; fi
        done)
        if test -n "$$android_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh delete \
            "clients/$$android_client_id/protocol-mappers/models/$$android_mapper_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        fi
        /opt/keycloak/bin/kcadm.sh create \
          "clients/$$android_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          -f /tmp/termlink-android-audience.json >/dev/null
        acceptance_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-acceptance-cli \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$acceptance_client_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$acceptance_client_id" \
          --config /tmp/kcadm.config -r termlink \
          -s enabled=true \
          -s publicClient=true \
          -s bearerOnly=false \
          -s standardFlowEnabled=false \
          -s directAccessGrantsEnabled=true \
          -s implicitFlowEnabled=false \
          -s serviceAccountsEnabled=false \
          -s fullScopeAllowed=false >/dev/null
        acceptance_mapper_table=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$acceptance_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        acceptance_mapper_id=$$(printf '%s\n' "$$acceptance_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-server-audience; then printf '%s' "$$id"; fi
        done)
        if test -n "$$acceptance_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh delete \
            "clients/$$acceptance_client_id/protocol-mappers/models/$$acceptance_mapper_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        fi
        /opt/keycloak/bin/kcadm.sh create \
          "clients/$$acceptance_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          -f /tmp/termlink-android-audience.json >/dev/null
        windows_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-windows \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$windows_client_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$windows_client_id" \
          --config /tmp/kcadm.config -r termlink \
          -s enabled=true \
          -s publicClient=true \
          -s standardFlowEnabled=true \
          -s directAccessGrantsEnabled=true \
          -s implicitFlowEnabled=false \
          -s serviceAccountsEnabled=false \
          -s fullScopeAllowed=false \
          -s 'redirectUris=["http://127.0.0.1:43971/oauth2/callback"]' \
          -s "authenticationFlowBindingOverrides={\"browser\":\"$$native_flow_id\"}" \
          -s 'attributes={"pkce.code.challenge.method":"S256"}' >/dev/null
        client_scope_table=$$(/opt/keycloak/bin/kcadm.sh get client-scopes \
          --config /tmp/kcadm.config \
          -r termlink --fields id,name --format csv --noquotes)
        for scope_name in web-origins acr roles profile basic email; do
          scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
            if test "$$name" = "$$scope_name"; then printf '%s' "$$id"; fi
          done)
          test -n "$$scope_id"
          /opt/keycloak/bin/kcadm.sh update \
            "clients/$$windows_client_id/default-client-scopes/$$scope_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        done
        offline_scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
          if test "$$name" = offline_access; then printf '%s' "$$id"; fi
        done)
        test -n "$$offline_scope_id"
        /opt/keycloak/bin/kcadm.sh update \
          "clients/$$windows_client_id/optional-client-scopes/$$offline_scope_id" \
          --config /tmp/kcadm.config -r termlink >/dev/null
        web_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-web \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$web_client_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$web_client_id" \
          --config /tmp/kcadm.config -r termlink \
          -s 'name=TermLink 个人中心' \
          -s rootUrl=${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910} \
          -s baseUrl=${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/account \
          -s 'redirectUris=["${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/auth/callback","${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/account"]' \
          -s 'webOrigins=["${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}"]' >/dev/null
        for scope_name in web-origins acr roles profile basic email; do
          scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
            if test "$$name" = "$$scope_name"; then printf '%s' "$$id"; fi
          done)
          test -n "$$scope_id"
          /opt/keycloak/bin/kcadm.sh update \
            "clients/$$web_client_id/default-client-scopes/$$scope_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        done
        cat > /tmp/termlink-web-realm-roles.json <<'JSON'
        {
          "name": "termlink-web-realm-roles",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-realm-role-mapper",
          "consentRequired": false,
          "config": {
            "multivalued": "true",
            "claim.name": "realm_access.roles",
            "jsonType.label": "String",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
        JSON
        cat > /tmp/termlink-web-nickname.json <<'JSON'
        {
          "name": "termlink-web-nickname",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-attribute-mapper",
          "consentRequired": false,
          "config": {
            "user.attribute": "nickname",
            "claim.name": "nickname",
            "jsonType.label": "String",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
        JSON
        cat > /tmp/termlink-web-amr.json <<'JSON'
        {
          "name": "termlink-web-amr",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "amr",
            "claim.value": "[\"pwd\"]",
            "jsonType.label": "JSON",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "false",
            "access.tokenResponse.claim": "false"
          }
        }
        JSON
        web_mapper_table=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$web_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        web_mapper_id=$$(printf '%s\n' "$$web_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-web-realm-roles; then printf '%s' "$$id"; fi
        done)
        if test -z "$$web_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$web_client_id/protocol-mappers/models" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-web-realm-roles.json >/dev/null
        fi
        web_nickname_mapper_id=$$(printf '%s\n' "$$web_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-web-nickname; then printf '%s' "$$id"; fi
        done)
        if test -z "$$web_nickname_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$web_client_id/protocol-mappers/models" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-web-nickname.json >/dev/null
        fi
        web_amr_mapper_id=$$(printf '%s\n' "$$web_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-web-amr; then printf '%s' "$$id"; fi
        done)
        if test -z "$$web_amr_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$web_client_id/protocol-mappers/models" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-web-amr.json >/dev/null
        else
          /opt/keycloak/bin/kcadm.sh delete \
            "clients/$$web_client_id/protocol-mappers/models/$$web_amr_mapper_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$web_client_id/protocol-mappers/models" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-web-amr.json >/dev/null
        fi
        step_up_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config -r termlink -q clientId=termlink-web-step-up \
          --fields id --format csv --noquotes | tail -n 1)
        if test -z "$$step_up_client_id"; then
          step_up_client_id=$$(/opt/keycloak/bin/kcadm.sh create clients \
            --config /tmp/kcadm.config -r termlink -i \
            -s clientId=termlink-web-step-up -s protocol=openid-connect)
        fi
        test -n "$$step_up_client_id" -a -n "$$step_up_flow_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$step_up_client_id" \
          --config /tmp/kcadm.config -r termlink \
          -s 'name=TermLink 高风险操作 MFA 验证' \
          -s enabled=true \
          -s publicClient=true \
          -s standardFlowEnabled=true \
          -s directAccessGrantsEnabled=false \
          -s implicitFlowEnabled=false \
          -s serviceAccountsEnabled=false \
          -s fullScopeAllowed=false \
          -s rootUrl=${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910} \
          -s baseUrl=${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/account \
          -s 'redirectUris=["${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/auth/callback"]' \
          -s 'webOrigins=["${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}"]' \
          -s 'attributes={"pkce.code.challenge.method":"S256"}' \
          -s "authenticationFlowBindingOverrides={\"browser\":\"$$step_up_flow_id\"}" >/dev/null
        for scope_name in web-origins acr profile basic email; do
          scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
            if test "$$name" = "$$scope_name"; then printf '%s' "$$id"; fi
          done)
          test -n "$$scope_id"
          /opt/keycloak/bin/kcadm.sh update \
            "clients/$$step_up_client_id/default-client-scopes/$$scope_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        done
        cat > /tmp/termlink-web-step-up-amr.json <<'JSON'
        {
          "name": "termlink-web-step-up-amr",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-hardcoded-claim-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "amr",
            "claim.value": "[\"otp\"]",
            "jsonType.label": "JSON",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "false",
            "access.tokenResponse.claim": "false"
          }
        }
        JSON
        step_up_mapper_table=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$step_up_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        step_up_amr_mapper_id=$$(printf '%s\n' "$$step_up_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-web-step-up-amr; then printf '%s' "$$id"; fi
        done)
        if test -n "$$step_up_amr_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh delete \
            "clients/$$step_up_client_id/protocol-mappers/models/$$step_up_amr_mapper_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        fi
        /opt/keycloak/bin/kcadm.sh create \
          "clients/$$step_up_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          -f /tmp/termlink-web-step-up-amr.json >/dev/null
        recovery_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config -r termlink \
          -q clientId=termlink-registration-recovery \
          --fields id --format csv --noquotes | tail -n 1)
        if test -z "$$recovery_client_id"; then
          recovery_client_id=$$(/opt/keycloak/bin/kcadm.sh create clients \
            --config /tmp/kcadm.config -r termlink -i \
            -s clientId=termlink-registration-recovery \
            -s 'name=TermLink Registration and Identity Recovery' \
            -s enabled=true -s publicClient=false -s bearerOnly=false \
            -s standardFlowEnabled=false -s implicitFlowEnabled=false \
            -s directAccessGrantsEnabled=false -s serviceAccountsEnabled=true \
            -s fullScopeAllowed=false)
        else
          /opt/keycloak/bin/kcadm.sh update "clients/$$recovery_client_id" \
            --config /tmp/kcadm.config -r termlink \
            -s enabled=true -s publicClient=false -s bearerOnly=false \
            -s standardFlowEnabled=false -s implicitFlowEnabled=false \
            -s directAccessGrantsEnabled=false -s serviceAccountsEnabled=true \
            -s fullScopeAllowed=false >/dev/null
        fi
        recovery_service_account=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$recovery_client_id/service-account-user" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,username --format csv --noquotes | tail -n 1)
        IFS=, read -r recovery_user_id recovery_username <<EOF
        $$recovery_service_account
        EOF
        test -n "$$recovery_user_id" -a -n "$$recovery_username"
        realm_management_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config -r termlink \
          -q clientId=realm-management \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$realm_management_id"
        recovery_roles=$$(/opt/keycloak/bin/kcadm.sh get \
          "users/$$recovery_user_id/role-mappings/clients/$$realm_management_id" \
          --config /tmp/kcadm.config -r termlink \
          --fields name --format csv --noquotes)
        printf '%s\n' "$$recovery_roles" | while IFS= read -r assigned_role; do
          case "$$assigned_role" in
            query-users|manage-users|manage-realm|'') ;;
            *)
              /opt/keycloak/bin/kcadm.sh remove-roles \
                --config /tmp/kcadm.config -r termlink \
                --uusername "$$recovery_username" \
                --cclientid realm-management \
                --rolename "$$assigned_role" >/dev/null
              ;;
          esac
        done
        for recovery_role in query-users manage-users manage-realm; do
          if ! printf '%s\n' "$$recovery_roles" | grep -Fxq "$$recovery_role"; then
            /opt/keycloak/bin/kcadm.sh add-roles \
              --config /tmp/kcadm.config -r termlink \
              --uusername "$$recovery_username" \
              --cclientid realm-management \
              --rolename "$$recovery_role" >/dev/null
          fi
          recovery_role_id=$$(/opt/keycloak/bin/kcadm.sh get \
            "clients/$$realm_management_id/roles/$$recovery_role" \
            --config /tmp/kcadm.config -r termlink \
            --fields id --format csv --noquotes | tail -n 1)
          test -n "$$recovery_role_id"
          printf '[{"id":"%s","name":"%s","clientRole":true,"containerId":"%s"}]' \
            "$$recovery_role_id" "$$recovery_role" "$$realm_management_id" \
            > /tmp/termlink-recovery-scope-role.json
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$recovery_client_id/scope-mappings/clients/$$realm_management_id" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-recovery-scope-role.json >/dev/null
        done
        recovery_secret=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$recovery_client_id/client-secret" \
          --config /tmp/kcadm.config -r termlink \
          --fields value --format csv --noquotes | tail -n 1)
        test -n "$$recovery_secret"
        printf '%s' "$$recovery_secret" > /target/server-secrets/keycloak_admin_client_secret
        unset recovery_secret
        admin_user_id=$$(/opt/keycloak/bin/kcadm.sh get users \
          --config /tmp/kcadm.config \
          -r termlink -q exact=true -q username=admin \
          --fields id --format csv --noquotes | tail -n 1)
        if test -z "$$admin_user_id"; then
          admin_user_id=$$(/opt/keycloak/bin/kcadm.sh create users \
            --config /tmp/kcadm.config -r termlink \
            -s username=admin -s enabled=true -i)
          /opt/keycloak/bin/kcadm.sh update "users/$$admin_user_id" \
            --config /tmp/kcadm.config -r termlink \
            -s 'attributes.nickname=["TermLink 管理员"]' \
            -s email=admin@termlink.local -s emailVerified=true -s enabled=true >/dev/null
          /opt/keycloak/bin/kcadm.sh set-password \
            --config /tmp/kcadm.config \
            -r termlink --userid "$$admin_user_id" \
            --new-password "$$initial_admin_password" --temporary >/dev/null
          /opt/keycloak/bin/kcadm.sh add-roles \
            --config /tmp/kcadm.config -r termlink \
            --uid "$$admin_user_id" --rolename TERMLINK_BOOTSTRAP_MANAGED_V1 >/dev/null
        else
          admin_realm_roles=$$(/opt/keycloak/bin/kcadm.sh get \
            "users/$$admin_user_id/role-mappings/realm" \
            --config /tmp/kcadm.config -r termlink \
            --fields name --format csv --noquotes)
          if ! printf '%s\n' "$$admin_realm_roles" | grep -Fxq TERMLINK_BOOTSTRAP_MANAGED_V1; then
            printf '%s\n' 'Refusing to grant SUPER_ADMIN to an unmanaged existing admin account.' >&2
            exit 1
          fi
        fi
        /opt/keycloak/bin/kcadm.sh add-roles \
          --config /tmp/kcadm.config -r termlink \
          --uid "$$admin_user_id" --rolename SUPER_ADMIN >/dev/null
        for username in acceptance-user acceptance-probe; do
          user_id=$$(/opt/keycloak/bin/kcadm.sh get users \
            --config /tmp/kcadm.config \
            -r termlink -q exact=true -q username="$$username" \
            --fields id --format csv --noquotes | tail -n 1)
          if test -z "$$user_id"; then
            user_id=$$(/opt/keycloak/bin/kcadm.sh create users \
              --config /tmp/kcadm.config \
              -r termlink -s username="$$username" -s enabled=true -i)
            # Setting even an unchanged password revokes active Keycloak
            # sessions. Keep ordinary production-style rebuilds idempotent;
            # Start-ProductionAcceptance -Reset still creates fresh users and
            # therefore initializes their managed password here.
            /opt/keycloak/bin/kcadm.sh set-password \
              --config /tmp/kcadm.config \
              -r termlink --userid "$$user_id" --new-password "$$user_password" >/dev/null
          fi
          /opt/keycloak/bin/kcadm.sh update "users/$$user_id" \
            --config /tmp/kcadm.config \
            -r termlink \
            -s "attributes.nickname=[\"$$username\"]" \
            -s email="$$username@termlink.local" \
            -s emailVerified=true \
            -s enabled=true >/dev/null
          /opt/keycloak/bin/kcadm.sh add-roles \
            --config /tmp/kcadm.config -r termlink \
            --uid "$$user_id" --rolename USER >/dev/null
        done
        /opt/keycloak/bin/kcadm.sh update realms/termlink \
          --config /tmp/kcadm.config \
          -s registrationAllowed=true >/dev/null
    networks: ["frontend"]
    volumes:
      - acceptance-keycloak-init-secrets:/run/secrets:ro
      - acceptance-server-secrets:/target/server-secrets
      - ../acceptance/keycloak-user-profile.json:/opt/keycloak/data/import/termlink-user-profile.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak:
        condition: service_healthy
      runtime-secrets-init:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: termlink
      POSTGRES_USER: termlink
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks: ["backend"]
    volumes:
      - acceptance-postgres-data:/var/lib/postgresql/data
      - acceptance-postgres-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termlink -d termlink"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully

  valkey:
    image: valkey/valkey:8.1.1-alpine@sha256:6a57d58c0a37cf7acc3045ac0fd6dd91be339774106ab4d9ca088013a096a99f
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/valkey_password)"
        test -n "$$password"
        case "$$password" in *[!A-Za-z0-9_-]*) exit 1;; esac
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$password" > /run/valkey/users.acl
        unset password
        exec valkey-server --appendonly yes --aclfile /run/valkey/users.acl
    networks: ["backend"]
    volumes:
      - acceptance-valkey-data:/data
      - acceptance-valkey-secrets:/run/secrets:ro
    read_only: true
    user: "999:1000"
    tmpfs:
      - /run/valkey:rw,noexec,nosuid,size=1m,uid=999,gid=1000,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli --user default ping | grep -qx PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    networks:
      - object-control
      - object
    volumes:
      - acceptance-minio-data:/data
      - acceptance-minio-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 45
    restart: unless-stopped
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully

  server-secrets-init:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        for name in oidc_client_secret database_url redis_url token_signing_key s3_access_key s3_secret_key; do
          rm -f "/target/$$name";
          cp "/run/secrets/$$name" "/target/$$name";
          chmod 0400 "/target/$$name";
          chown 65532:65532 "/target/$$name";
        done;
        rm -f /target/acceptance-root-ca.crt;
        cp /data/caddy/pki/authorities/local/root.crt /target/acceptance-root-ca.crt;
        chmod 0400 /target/acceptance-root-ca.crt;
        chown 65532:65532 /target/acceptance-root-ca.crt;
        test -s /target/keycloak_admin_client_secret;
        chown 0:0 /target/keycloak_admin_client_secret;
        chmod 0400 /target/keycloak_admin_client_secret;
        chown 65532:65532 /target/keycloak_admin_client_secret
    secrets:
      - oidc_client_secret
      - database_url
      - redis_url
      - token_signing_key
      - s3_access_key
      - s3_secret_key
    volumes:
      - acceptance-server-secrets:/target
      - acceptance-caddy-data:/data:ro
    networks: ["frontend"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      edge:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    image: termlink-production-acceptance-server:local
    # The server service owns the sole build definition for this shared image.
    # Compose builds all declared images before it creates the dependency graph,
    # so migrate reuses the exact image without a duplicate build invocation.
    command: ["migrate"]
    environment: &termlink_environment
      TERMLINK_PUBLIC_URL: ${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}
      TERMLINK_OIDC_ISSUER: ${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/realms/termlink
      TERMLINK_OIDC_CLIENT_ID: termlink-server
      TERMLINK_OIDC_ALLOWED_PARTIES: termlink-android,termlink-windows,termlink-acceptance-cli
      TERMLINK_ANDROID_OIDC_CLIENT_ID: termlink-android
      TERMLINK_ANDROID_OIDC_REDIRECT_URI: dev.termlink:/oauth2redirect
      TERMLINK_WINDOWS_OIDC_CLIENT_ID: termlink-windows
      TERMLINK_WINDOWS_REGISTRATION_OIDC_PARTIES: termlink-windows,termlink-acceptance-cli
      TERMLINK_WINDOWS_OIDC_REDIRECT_URI: http://127.0.0.1:43971/oauth2/callback
      TERMLINK_WEB_OIDC_CLIENT_ID: termlink-web
      TERMLINK_WEB_STEP_UP_OIDC_CLIENT_ID: termlink-web-step-up
      TERMLINK_WEB_OIDC_REDIRECT_URI: ${TERMLINK_ACCEPTANCE_PUBLIC_ORIGIN:-https://termlink.kget.cc:8910}/auth/callback
      TERMLINK_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      TERMLINK_DATABASE_URL_FILE: /run/secrets/database_url
      TERMLINK_REDIS_URL_FILE: /run/secrets/redis_url
      TERMLINK_TOKEN_SIGNING_KEY_FILE: /run/secrets/token_signing_key
      TERMLINK_HISTORY_ENABLED: "true"
      TERMLINK_S3_ENDPOINT: http://minio:9000
      TERMLINK_S3_PUBLIC_ENDPOINT: ${TERMLINK_ACCEPTANCE_HISTORY_ORIGIN:-https://history.127.0.0.1.sslip.io:9443}
      TERMLINK_S3_BUCKET: termlink-history
      TERMLINK_S3_REGION: us-east-1
      TERMLINK_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      TERMLINK_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      TERMLINK_LISTEN_ADDR: :8080
      TERMLINK_LOG_LEVEL: info
    volumes:
      - acceptance-server-secrets:/run/secrets:ro
    networks: ["backend"]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      server-secrets-init:
        condition: service_completed_successfully
    restart: "no"

  server:
    image: termlink-production-acceptance-server:local
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      <<: *termlink_environment
      SSL_CERT_FILE: /run/secrets/acceptance-root-ca.crt
      TERMLINK_APPSHIP_BASE_URL: ${TERMLINK_APPSHIP_BASE_URL:-https://appship.kget.cc:8910}
      TERMLINK_APPSHIP_ALLOWED_PRIVATE_IPS: ${TERMLINK_APPSHIP_ALLOWED_PRIVATE_IPS:-}
      TERMLINK_REGISTRATION_RECOVERY_ENABLED: "true"
      TERMLINK_KEYCLOAK_ADMIN_CLIENT_ID: termlink-registration-recovery
      TERMLINK_KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/keycloak_admin_client_secret
      # Recovery uses the private identity-management hop. The public origin
      # deliberately does not expose Keycloak's /admin API.
      TERMLINK_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
    networks:
      - frontend
      - backend
      - object-control
      - egress
    volumes:
      - acceptance-server-secrets:/run/secrets:ro
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/termlink-server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 45
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      lucky-upstream:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy

secrets:
  keycloak_admin_password:
    file: ${TERMLINK_ACCEPTANCE_KEYCLOAK_ADMIN_PASSWORD_FILE:?required}
  admin_initial_password:
    file: ${TERMLINK_ACCEPTANCE_ADMIN_INITIAL_PASSWORD_FILE:?required}
  acceptance_user_password:
    file: ${TERMLINK_ACCEPTANCE_USER_PASSWORD_FILE:?required}
  postgres_password:
    file: ${TERMLINK_ACCEPTANCE_POSTGRES_PASSWORD_FILE:?required}
  valkey_password:
    file: ${TERMLINK_ACCEPTANCE_VALKEY_PASSWORD_FILE:?required}
  oidc_client_secret:
    file: ${TERMLINK_ACCEPTANCE_OIDC_CLIENT_SECRET_FILE:?required}
  database_url:
    file: ${TERMLINK_ACCEPTANCE_DATABASE_URL_FILE:?required}
  redis_url:
    file: ${TERMLINK_ACCEPTANCE_REDIS_URL_FILE:?required}
  token_signing_key:
    file: ${TERMLINK_ACCEPTANCE_TOKEN_SIGNING_KEY_FILE:?required}
  s3_access_key:
    file: ${TERMLINK_ACCEPTANCE_S3_ACCESS_KEY_FILE:?required}
  s3_secret_key:
    file: ${TERMLINK_ACCEPTANCE_S3_SECRET_KEY_FILE:?required}

volumes:
  acceptance-caddy-data:
  acceptance-caddy-config:
  acceptance-keycloak-data:
  acceptance-keycloak-runtime-secrets:
  acceptance-keycloak-init-secrets:
  acceptance-postgres-data:
  acceptance-postgres-secrets:
  acceptance-server-secrets:
  acceptance-valkey-data:
  acceptance-valkey-secrets:
  acceptance-minio-data:
  acceptance-minio-secrets:

networks:
  public:
  frontend:
    internal: true
  backend:
    internal: true
  object:
    internal: true
  object-control:
    internal: true
  egress:
