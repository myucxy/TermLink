name: termlink-production-acceptance

services:
  lucky-upstream:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "0.0.0.0:8080:8080"
    networks: ["acceptance"]
    volumes:
      - ../acceptance/LuckyUpstream.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__termlink_upstream_health"]
      interval: 2s
      timeout: 2s
      retries: 30

  edge:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      acceptance:
        aliases:
          - api.127.0.0.1.sslip.io
          - id.127.0.0.1.sslip.io
    volumes:
      - ../acceptance/Caddyfile:/etc/caddy/Caddyfile:ro
      - acceptance-caddy-data:/data
      - acceptance-caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  oidc-ca-ready:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        for attempt in $$(seq 1 60); do
          test -s /data/caddy/pki/authorities/local/root.crt && exit 0;
          sleep 1;
        done;
        exit 1
    volumes:
      - acceptance-caddy-data:/data:ro
    networks: ["acceptance"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      edge:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: ${TERMLINK_ACCEPTANCE_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3.2@sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: acceptance-admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://termlink.kget.cc:8910
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - keycloak_admin_password
    networks: ["acceptance"]
    volumes:
      - ../acceptance/keycloak-realm.json:/opt/keycloak/data/import/termlink-realm.json:ro
      - ../acceptance/keycloak-theme/termlink:/opt/keycloak/themes/termlink:ro
      - acceptance-keycloak-data:/opt/keycloak/data
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  keycloak-init:
    image: ${TERMLINK_ACCEPTANCE_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3.2@sha256:98fab020a3a490aba0978f237e2a06cd0ea42bf149c6cf10f11c0aaf27728ff2}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        admin_password="$$(cat /run/secrets/keycloak_admin_password)"
        initial_admin_password="$$(cat /run/secrets/admin_initial_password)"
        user_password="$$(cat /run/secrets/acceptance_user_password)"
        for attempt in $$(seq 1 90); do
          if /opt/keycloak/bin/kcadm.sh config credentials \
            --config /tmp/kcadm.config \
            --server http://keycloak:8080 \
            --realm master \
            --user acceptance-admin \
            --password "$$admin_password" >/dev/null 2>&1; then
            break
          fi
          test "$$attempt" -lt 90 || exit 1
          sleep 1
        done
        /opt/keycloak/bin/kcadm.sh update realms/termlink \
          --config /tmp/kcadm.config \
          -s displayName=TermLink \
          -s loginTheme=termlink \
          -s internationalizationEnabled=true \
          -s 'supportedLocales=["zh-CN","en"]' \
          -s defaultLocale=zh-CN \
          -s rememberMe=true >/dev/null
        for role_name in SUPER_ADMIN ADMIN AUDITOR USER; do
          if ! /opt/keycloak/bin/kcadm.sh get "roles/$$role_name" \
            --config /tmp/kcadm.config -r termlink >/dev/null 2>&1; then
            /opt/keycloak/bin/kcadm.sh create roles \
              --config /tmp/kcadm.config -r termlink \
              -s name="$$role_name" >/dev/null
          fi
        done
        windows_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-windows \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$windows_client_id"
        client_scope_table=$$(/opt/keycloak/bin/kcadm.sh get client-scopes \
          --config /tmp/kcadm.config \
          -r termlink --fields id,name --format csv --noquotes)
        for scope_name in web-origins acr roles profile basic email; do
          scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
            if test "$$name" = "$$scope_name"; then printf '%s' "$$id"; fi
          done)
          test -n "$$scope_id"
          /opt/keycloak/bin/kcadm.sh update \
            "clients/$$windows_client_id/default-client-scopes/$$scope_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        done
        offline_scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
          if test "$$name" = offline_access; then printf '%s' "$$id"; fi
        done)
        test -n "$$offline_scope_id"
        /opt/keycloak/bin/kcadm.sh update \
          "clients/$$windows_client_id/optional-client-scopes/$$offline_scope_id" \
          --config /tmp/kcadm.config -r termlink >/dev/null
        web_client_id=$$(/opt/keycloak/bin/kcadm.sh get clients \
          --config /tmp/kcadm.config \
          -r termlink -q clientId=termlink-web \
          --fields id --format csv --noquotes | tail -n 1)
        test -n "$$web_client_id"
        for scope_name in web-origins acr roles profile basic email; do
          scope_id=$$(printf '%s\n' "$$client_scope_table" | while IFS=, read -r id name; do
            if test "$$name" = "$$scope_name"; then printf '%s' "$$id"; fi
          done)
          test -n "$$scope_id"
          /opt/keycloak/bin/kcadm.sh update \
            "clients/$$web_client_id/default-client-scopes/$$scope_id" \
            --config /tmp/kcadm.config -r termlink >/dev/null
        done
        cat > /tmp/termlink-web-realm-roles.json <<'JSON'
        {
          "name": "termlink-web-realm-roles",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-realm-role-mapper",
          "consentRequired": false,
          "config": {
            "multivalued": "true",
            "claim.name": "realm_access.roles",
            "jsonType.label": "String",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
        JSON
        web_mapper_table=$$(/opt/keycloak/bin/kcadm.sh get \
          "clients/$$web_client_id/protocol-mappers/models" \
          --config /tmp/kcadm.config -r termlink \
          --fields id,name --format csv --noquotes)
        web_mapper_id=$$(printf '%s\n' "$$web_mapper_table" | while IFS=, read -r id name; do
          if test "$$name" = termlink-web-realm-roles; then printf '%s' "$$id"; fi
        done)
        if test -z "$$web_mapper_id"; then
          /opt/keycloak/bin/kcadm.sh create \
            "clients/$$web_client_id/protocol-mappers/models" \
            --config /tmp/kcadm.config -r termlink \
            -f /tmp/termlink-web-realm-roles.json >/dev/null
        fi
        admin_user_id=$$(/opt/keycloak/bin/kcadm.sh get users \
          --config /tmp/kcadm.config \
          -r termlink -q exact=true -q username=admin \
          --fields id --format csv --noquotes | tail -n 1)
        if test -z "$$admin_user_id"; then
          admin_user_id=$$(/opt/keycloak/bin/kcadm.sh create users \
            --config /tmp/kcadm.config -r termlink \
            -s username=admin -s enabled=true -i)
          /opt/keycloak/bin/kcadm.sh update "users/$$admin_user_id" \
            --config /tmp/kcadm.config -r termlink \
            -s firstName=TermLink -s lastName=Administrator \
            -s email=admin@termlink.local -s emailVerified=true -s enabled=true >/dev/null
          /opt/keycloak/bin/kcadm.sh set-password \
            --config /tmp/kcadm.config \
            -r termlink --userid "$$admin_user_id" \
            --new-password "$$initial_admin_password" --temporary >/dev/null
        fi
        /opt/keycloak/bin/kcadm.sh add-roles \
          --config /tmp/kcadm.config -r termlink \
          --uid "$$admin_user_id" --rolename SUPER_ADMIN >/dev/null
        for username in acceptance-user acceptance-probe; do
          user_id=$$(/opt/keycloak/bin/kcadm.sh get users \
            --config /tmp/kcadm.config \
            -r termlink -q exact=true -q username="$$username" \
            --fields id --format csv --noquotes | tail -n 1)
          if test -z "$$user_id"; then
            user_id=$$(/opt/keycloak/bin/kcadm.sh create users \
              --config /tmp/kcadm.config \
              -r termlink -s username="$$username" -s enabled=true -i)
          fi
          /opt/keycloak/bin/kcadm.sh update "users/$$user_id" \
            --config /tmp/kcadm.config \
            -r termlink \
            -s firstName=Acceptance \
            -s lastName="$$username" \
            -s email="$$username@termlink.local" \
            -s emailVerified=true \
            -s enabled=true >/dev/null
          /opt/keycloak/bin/kcadm.sh set-password \
            --config /tmp/kcadm.config \
            -r termlink --userid "$$user_id" --new-password "$$user_password" >/dev/null
          /opt/keycloak/bin/kcadm.sh add-roles \
            --config /tmp/kcadm.config -r termlink \
            --uid "$$user_id" --rolename USER >/dev/null
        done
    secrets:
      - keycloak_admin_password
      - admin_initial_password
      - acceptance_user_password
    networks: ["acceptance"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  postgres:
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: termlink
      POSTGRES_USER: termlink
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks: ["acceptance"]
    volumes:
      - acceptance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termlink -d termlink"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.1-alpine@sha256:6a57d58c0a37cf7acc3045ac0fd6dd91be339774106ab4d9ca088013a096a99f
    command: ["valkey-server", "--appendonly", "yes"]
    networks: ["acceptance"]
    volumes:
      - acceptance-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  server-secrets-init:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        for name in oidc_client_secret database_url redis_url token_signing_key; do
          rm -f "/target/$$name";
          cp "/run/secrets/$$name" "/target/$$name";
          chmod 0400 "/target/$$name";
          chown 65532:65532 "/target/$$name";
        done;
        rm -f /target/acceptance-root-ca.crt;
        cp /data/caddy/pki/authorities/local/root.crt /target/acceptance-root-ca.crt;
        chmod 0400 /target/acceptance-root-ca.crt;
        chown 65532:65532 /target/acceptance-root-ca.crt
    secrets:
      - oidc_client_secret
      - database_url
      - redis_url
      - token_signing_key
    volumes:
      - acceptance-server-secrets:/target
      - acceptance-caddy-data:/data:ro
    networks: ["acceptance"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      edge:
        condition: service_healthy
    restart: "no"

  migrate:
    image: termlink-production-acceptance-server:local
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command: ["migrate"]
    environment: &termlink_environment
      TERMLINK_PUBLIC_URL: https://termlink.kget.cc:8910
      TERMLINK_OIDC_ISSUER: https://termlink.kget.cc:8910/realms/termlink
      TERMLINK_OIDC_CLIENT_ID: termlink-server
      TERMLINK_ANDROID_OIDC_CLIENT_ID: termlink-android
      TERMLINK_ANDROID_OIDC_REDIRECT_URI: dev.termlink:/oauth2redirect
      TERMLINK_WINDOWS_OIDC_CLIENT_ID: termlink-windows
      TERMLINK_WINDOWS_OIDC_REDIRECT_URI: http://127.0.0.1:43971/oauth2/callback
      TERMLINK_WEB_OIDC_CLIENT_ID: termlink-web
      TERMLINK_WEB_OIDC_REDIRECT_URI: https://termlink.kget.cc:8910/auth/callback
      TERMLINK_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      TERMLINK_DATABASE_URL_FILE: /run/secrets/database_url
      TERMLINK_REDIS_URL_FILE: /run/secrets/redis_url
      TERMLINK_TOKEN_SIGNING_KEY_FILE: /run/secrets/token_signing_key
      TERMLINK_HISTORY_ENABLED: "false"
      TERMLINK_LISTEN_ADDR: :8080
      TERMLINK_LOG_LEVEL: info
    volumes:
      - acceptance-server-secrets:/run/secrets:ro
    networks: ["acceptance"]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      server-secrets-init:
        condition: service_completed_successfully
    restart: "no"

  server:
    image: termlink-production-acceptance-server:local
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      <<: *termlink_environment
      SSL_CERT_FILE: /run/secrets/acceptance-root-ca.crt
    networks: ["acceptance"]
    volumes:
      - acceptance-server-secrets:/run/secrets:ro
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/termlink-server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 45
    depends_on:
      migrate:
        condition: service_completed_successfully
      oidc-ca-ready:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      lucky-upstream:
        condition: service_healthy
      valkey:
        condition: service_healthy

secrets:
  keycloak_admin_password:
    file: ${TERMLINK_ACCEPTANCE_KEYCLOAK_ADMIN_PASSWORD_FILE:?required}
  admin_initial_password:
    file: ${TERMLINK_ACCEPTANCE_ADMIN_INITIAL_PASSWORD_FILE:?required}
  acceptance_user_password:
    file: ${TERMLINK_ACCEPTANCE_USER_PASSWORD_FILE:?required}
  postgres_password:
    file: ${TERMLINK_ACCEPTANCE_POSTGRES_PASSWORD_FILE:?required}
  oidc_client_secret:
    file: ${TERMLINK_ACCEPTANCE_OIDC_CLIENT_SECRET_FILE:?required}
  database_url:
    file: ${TERMLINK_ACCEPTANCE_DATABASE_URL_FILE:?required}
  redis_url:
    file: ${TERMLINK_ACCEPTANCE_REDIS_URL_FILE:?required}
  token_signing_key:
    file: ${TERMLINK_ACCEPTANCE_TOKEN_SIGNING_KEY_FILE:?required}

volumes:
  acceptance-caddy-data:
  acceptance-caddy-config:
  acceptance-keycloak-data:
  acceptance-postgres-data:
  acceptance-server-secrets:
  acceptance-valkey-data:

networks:
  acceptance:
