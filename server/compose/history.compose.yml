services:
  server:
    environment:
      TERMLINK_HISTORY_ENABLED: "true"
      TERMLINK_S3_ENDPOINT: http://minio:9000
      TERMLINK_S3_PUBLIC_ENDPOINT: ${TERMLINK_S3_PUBLIC_ENDPOINT:-http://minio:9000}
      TERMLINK_S3_BUCKET: termlink-history
      TERMLINK_S3_REGION: us-east-1
      TERMLINK_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      TERMLINK_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets:
      - source: s3_access_key
        target: s3_access_key
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: s3_secret_key
        target: s3_secret_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets:
      - s3_access_key
      - s3_secret_key
    networks: ["private"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  minio-data:

secrets:
  s3_access_key:
    file: ${TERMLINK_S3_ACCESS_KEY_FILE:-../secrets/s3-access-key}
  s3_secret_key:
    file: ${TERMLINK_S3_SECRET_KEY_FILE:-../secrets/s3-secret-key}
