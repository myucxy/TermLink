name: termlink-integration

services:
  # Applied when this file is layered with core/history. The server keeps
  # using http://minio:9000 internally; only client presigned URLs use the
  # host-loopback address exposed below.
  server:
    image: ${TERMLINK_IMAGE:-ghcr.io/termlink/termlink-server:0.1.0}
    environment:
      TERMLINK_S3_PUBLIC_ENDPOINT: http://127.0.0.1:59000

  postgres:
    image: postgres:17.5-alpine3.22
    environment:
      POSTGRES_DB: termlink
      POSTGRES_USER: termlink
      POSTGRES_PASSWORD: integration-only-password
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termlink -d termlink"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.1-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # These credentials are disposable integration-test fixtures only.
      MINIO_ROOT_USER: integration-access
      MINIO_ROOT_PASSWORD: integration-only-password
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
