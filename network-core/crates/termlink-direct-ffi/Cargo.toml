[package]
name = "termlink-direct-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
termlink-direct-nat = { path = "../termlink-direct-nat" }
termlink-direct-path = { path = "../termlink-direct-path" }
termlink-direct-quic = { path = "../termlink-direct-quic" }
termlink-direct-route = { path = "../termlink-direct-route" }
termlink-direct-wire = { path = "../termlink-direct-wire" }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
