[workspace]
resolver = "3"
members = [
    "crates/termlink-direct-wire",
    "crates/termlink-direct-nat",
    "crates/termlink-direct-quic",
    "crates/termlink-direct-path",
    "crates/termlink-direct-route",
    "crates/termlink-direct-ffi",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
