<body>
<main class="lab">
  <div class="lab-heading">
    <div><div class="eyebrow">TERMLINK / DESIGN EXPLORATION 03</div><h1>原来的窗口，一起放到平板上。</h1><p>保留原有 CLI 与 AI 界面 · 自选列数 · 等比缩放</p></div>
    <span class="design-label">交互设计 · 非实际连接</span>
  </div>
  <div class="controls" aria-label="屏幕预览设置">
    <div class="control-group"><span class="control-label">屏幕比例</span><div class="ratios" id="ratios">
      <button data-ratio="auto" aria-pressed="false">自适应</button><button data-ratio="16:10" aria-pressed="true">16:10</button><button data-ratio="4:3" aria-pressed="false">4:3</button><button data-ratio="3:2" aria-pressed="false">3:2</button><button data-ratio="16:9" aria-pressed="false">16:9</button><button data-ratio="custom" aria-pressed="false">自定义</button>
    </div></div>
    <div class="separator"></div>
    <div class="control-group"><button id="rotate" aria-label="切换横竖屏">↻ 横竖切换</button><button id="actual" aria-pressed="false">1:1 预览</button></div>
    <form id="custom-form" class="custom hidden"><label for="width">宽</label><input id="width" type="number" min="360" max="2560" value="1180" required><span>×</span><label for="height">高</label><input id="height" type="number" min="360" max="2560" value="820" required><button type="submit">应用</button></form>
  </div>
  <div class="stage-wrap" id="stage-wrap"><div class="stage" id="stage"><iframe id="app" title="TermLink 平板工作台交互原型"></iframe></div></div>
  <div class="below"><span class="status" id="preview-status" role="status"></span><span><span class="hint-dot">●</span>试试拖动卡片、发送消息或切换屏幕比例</span></div>
</main>

  <div class="toolbar"><div class="filters" aria-label="会话类型"><button data-filter="all" aria-pressed="true">全部 <span class="count" data-count="all">4</span></button><button data-filter="cli" aria-pressed="false">CLI <span class="count" data-count="cli">2</span></button><button data-filter="ai" aria-pressed="false">AI <span class="count" data-count="ai">2</span></button></div><div class="toolbar-right"><label class="search"><svg><use href="#i-search"/></svg><input id="search" placeholder="搜索会话、设备" aria-label="搜索会话、设备"></label><label class="density-control"><span>列数</span><select id="column-preference" aria-label="窗口列数"><option value="auto">自动</option><option value="1">1 列</option><option value="2">2 列</option><option value="3">3 列</option><option value="4">4 列</option><option value="5">5 列</option></select></label><label class="density-control"><span>窗口比例</span><select id="ratio-preference" aria-label="单窗口比例"><option value="adaptive">屏幕适配</option><option value="4:3">4:3</option><option value="3:2">3:2</option><option value="16:10">16:10</option><option value="1:1">1:1</option><option value="3:4">3:4</option></select></label><div class="layout-group" aria-label="卡片布局"><button data-layout="tile" aria-pressed="true"><svg><use href="#i-grid"/></svg>平铺</button><button data-layout="free" aria-pressed="false"><svg><use href="#i-layers"/></svg>自由</button></div><button class="icon-button" id="reset" aria-label="重置演示工作台" title="重置工作台"><svg><use href="#i-undo"/></svg></button></div></div>

  <div class="keyboard hidden" id="keyboard" aria-label="模拟软键盘"><div class="keyboard-label"><span>模拟软键盘 · 仅向当前输入框发送字符</span><button id="hide-keyboard">收起 ↓</button></div><div class="keyrow" data-keys="Q W E R T Y U I O P"></div><div class="keyrow" data-keys="A S D F G H J K L"></div><div class="keyrow" data-keys="Z X C V B N M"></div><div class="keyrow"><button class="wide-key" data-key="Backspace">⌫</button><button class="space" data-key=" ">空格</button><button class="wide-key" data-key="Enter">Enter ↵</button></div></div>
  <footer class="footer"><span class="left"><span class="lock"><svg><use href="#i-lock"/></svg>Relay Only</span><span id="layout-status">双列平铺</span><span>交互原型 · 模拟内容</span></span><span id="focused">选择一张卡片开始</span></footer>
  <div id="toast" class="notice hidden" role="status" aria-live="polite"></div>
 </section>
</div>
<dialog id="sessions-dialog" aria-labelledby="sessions-title"><div class="dialog-title"><h2 id="sessions-title">全部会话</h2><button class="icon-button" data-close="sessions-dialog" aria-label="关闭会话列表"><svg><use href="#i-close"/></svg></button></div><p class="dialog-copy">打开已有会话窗口，保留它原来的终端或对话界面。</p><div class="session-picker" id="session-picker"></div></dialog>

<dialog id="help-dialog" aria-labelledby="help-title"><div class="dialog-title"><h2 id="help-title">原有界面，只调整窗口编排</h2><button class="icon-button" data-close="help-dialog" aria-label="关闭操作说明"><svg><use href="#i-close"/></svg></button></div><ul class="help-list"><li>拖动标题栏的<b>六点手柄</b>移动卡片。</li><li><b>平铺</b>模式自动对齐，拖动可交换顺序。</li><li><b>自由</b>模式可移动位置，拖右下角调节尺寸。</li><li>可选 1–5 列，内部等比缩放；窗口边框和展开按钮保持原尺寸。</li><li>屏幕适配按可用面积与列数计算比例；固定比例可选 4:3、3:2 等。</li><li>竖屏分屏过窄时回到单列，仍记住所选列数。</li><li>填充示例可快速比较 3／4／5 列的两行窗口效果。</li><li>点击展开全屏；<b>× 只收起卡片</b>，可从底部恢复。</li><li>按 <span class="keyboard-help">Alt + ← / →</span> 调整聚焦手柄的顺序。</li><li>CLI 在终端内部直接输入，保留底部两排快捷键。</li><li>AI 沿用搜索／文件／变更／用量与模型／授权输入区。</li><li>云朵菜单可演示请求或释放控制权；只有控制中才能输入。</li><li>布局与收起状态在本机保存，输入内容不保存。</li></ul><p class="dialog-copy">全部会话、回复、设备和连接状态为设计演示，不执行命令，不调用真实 AI。</p></dialog>
<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const board = $('#board'), scroll = $('#board-scroll');
const icon = (name) => '<svg aria-hidden="true"><use href="#i-'+name+'"/></svg>';
const escape = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = [
 {id:'cli-shell',type:'cli',agent:'PowerShell',brand:'terminal',name:'PowerShell 7',device:'Studio PC',status:'可输入',log:'shell'},
 {id:'ai-claude',type:'ai',agent:'Claude',brand:'claude',name:'检查远程升级的交互',device:'Studio PC',status:'等待输入',log:'claude'},
 {id:'cli-opencode',type:'cli',agent:'OpenCode CLI',brand:'opencode',name:'修复登录流程',device:'Office PC',status:'可输入',log:'opencode',hidden:true},
 {id:'ai-codex',type:'ai',agent:'Codex',brand:'codex',name:'梳理下一步计划',device:'Studio PC',status:'等待输入',log:'codex',hidden:true}
];
const key = 'termlink-tablet-native-design-v2';
let cards = base.map(c=>({...c,lines:[],draft:'',hidden:!!c.hidden})), mode='tile', filter='all', selected='cli-shell', zoom=null, dark=true, columns=2, columnPreference='auto', ratioPreference='adaptive', cardRatio=1, free=false, drag=null, newType='cli', toastTimer, activeInput=null, depth=1;
try {const saved=JSON.parse(localStorage.getItem(key));if(saved && Array.isArray(saved.cards)){
 const restored=saved.cards.filter(c=>c && typeof c.id==='string' && ['cli','ai'].includes(c.type) && typeof c.name==='string' && typeof c.device==='string' && typeof c.agent==='string').slice(0,24);
 if(restored.length) cards=restored.map(c=>({...c,brand:['terminal','claude','opencode','codex'].includes(c.brand)?c.brand:'terminal',status:c.type==='cli'?'可输入':'等待输入',lines:[],draft:'',busy:false,box:c.box&&['x','y','w','h'].every(k=>Number.isFinite(c.box[k]))?c.box:null}));
 mode=saved.mode==='free'?'free':'tile';dark=saved.dark!==false;columnPreference=['auto','1','2','3','4','5'].includes(saved.columnPreference)?saved.columnPreference:'auto';ratioPreference=['adaptive','4:3','3:2','16:10','1:1','3:4'].includes(saved.ratioPreference)?saved.ratioPreference:'adaptive';
}} catch (_) {}
function save(){try{localStorage.setItem(key,JSON.stringify({mode,dark,columnPreference,ratioPreference,cards:cards.map(({id,type,agent,brand,name,device,log,hidden,wide,tall,box})=>({id,type,agent,brand,name,device,log,hidden,wide,tall,box}))}));}catch(_){}}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2800);}
function visible(){const q=$('#search').value.trim().toLowerCase();return cards.filter(c=>!c.hidden && (filter==='all'||c.type===filter) && (!q||[c.name,c.device,c.agent].join(' ').toLowerCase().includes(q)));}
function sample(c) {
 if(c.type==='cli') {
  if(c.log==='opencode') return '<pre><span class="warm">▣ opencode</span>\n\nE:\\Projects\\TermLink · main\n\n<span class="dim">请检查设备登录流程中的异常处理。</span>\n\n✓ 已检查身份缓存和请求重试\n✓ 已定位错误处理边界\n\n<span class="dim">演示终端输出，不会执行真实命令。</span></pre>';
  return '<p>PowerShell 7.4.6</p><p>PS C:\\Projects\\TermLink&gt; dotnet build --no-restore</p><p class="dim">  TermLink.Agent → release/TermLink.Agent.dll\n  TermLink.SessionHost → release/TermLink.SessionHost.dll</p><p class="green">Build succeeded.</p><p>    0 Warning(s)\n    0 Error(s)</p><p class="dim">Time Elapsed 00:00:02.41</p>';
 }
 return lineHTML(c,{user:true,text:'检查远程升级的交互，保持现有窗口的操作方式。'})+
  '<details class="reasoning"><summary>● 思考摘要</summary><p>沿用终端与对话已有的工具、输入和阅读方式，仅调整外层窗口编排。</p></details>'+
  '<div class="message agent"><div class="message-head"><span>'+escape(c.agent)+'</span><button data-native="copy">复制</button><button data-native="quote">引用</button></div><p>可以。终端与对话继续使用各自现有的界面：</p><p>• CLI 保留终端内输入、云朵菜单和两排快捷键。<br>• AI 保留消息、会话工具、模型与授权方式。</p><div class="code-block"><div class="code-head"><span>text</span><button data-native="copy">复制</button></div><pre>窗口外层：移动 · 缩放 · 放大 · 收起\n窗口内部：沿用当前产品界面</pre></div><p>在平板上并排查看，需要专注时展开其中一个窗口。</p></div>';
}
function lineHTML(c,line) {
 if(c.type==='cli')return '<p class="'+(line.user?'':'dim')+'">'+(line.user?'PS C:\\Projects\\TermLink&gt; ':'')+escape(line.text)+'</p>';
 return line.user?'<div class="message user"><div class="user-bubble">'+escape(line.text).replace(/\n/g,'<br>')+'</div><div class="message-actions"><button data-native="copy" aria-label="复制消息">'+icon('copy')+'</button><button data-native="quote" aria-label="追加到草稿">'+icon('append')+'</button></div></div>':'<div class="message agent"><div class="message-head"><span>'+escape(c.agent)+'</span><button data-native="copy">复制</button><button data-native="quote">引用</button></div><p>'+escape(line.text).replace(/\n/g,'<br>')+'</p></div>';
}
function cloudMenu(c) {
 const enabled=c.control!==false;
 return '<div class="native-menu hidden"><div class="menu-label">'+(enabled?'控制中':'只读')+' · 服务端中转</div><button data-native="control">'+(enabled?'释放控制权':'请求控制权')+'</button><button data-native="reconnect">重新确认连接</button>'+(c.type==='cli'?'<button data-native="fit">按当前窗口适配（演示）</button><button data-native="frozen">'+(c.frozen?'回到实时':'冻结历史浏览')+'</button>':'<button data-native="info">会话信息</button>')+'</div>';
}
function terminalView(c) {
 const enabled=c.control!==false&&!c.frozen;
 const rows=[['keyboard','Esc','Backspace','↑','Del','Ctrl+C'],['paste','Tab','←','↓','→','Enter']];
 return '<section class="native-cli" aria-label="现有 CLI 终端界面"><div class="native-header cli-header"><i class="dot"></i><div class="session-name">'+escape(c.device)+' · '+escape(c.name)+'</div><button class="cloud-control" data-native="menu" aria-label="终端连接与控制"><span class="control-label">'+(c.control===false?'只读':'控制中')+'</span>'+icon('cloud')+'</button>'+cloudMenu(c)+'</div>'+
 (c.frozen?'<div class="frozen-banner">冻结历史浏览 · 只读<button data-native="frozen">回到实时</button></div>':'')+
 '<div class="card-body terminal" aria-label="终端内容，点击直接输入"><div class="output">'+(c.cleared?'':sample(c))+c.lines.map(l=>lineHTML(c,l)).join('')+'</div><form class="terminal-input"><span class="prompt">PS C:\\Projects\\TermLink&gt;</span><textarea aria-label="向 '+escape(c.name)+' 输入" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="4000"'+(enabled?'':' disabled')+'>'+escape(c.draft)+'</textarea></form></div><div class="cli-dock"><div class="dock-rows">'+rows.map(row=>'<div class="dock-row">'+row.map(k=>'<button type="button" data-terminal-key="'+k+'" aria-label="'+({'keyboard':'终端键盘','paste':'粘贴','Backspace':'退格'}[k]||k)+'"'+(!enabled&&k!=='keyboard'?' disabled':'')+'>'+(k==='keyboard'?icon('keyboard'):k==='paste'?icon('paste'):k==='Backspace'?'⌫':k)+'</button>').join('')+'</div>').join('')+'</div></div></section>';
}
function aiView(c) {
 const claude=c.brand==='claude',model=c.model||(claude?'glm-5.3':'gpt-6.1-sol');
 const modeLabel=c.permission||(claude?'计划模式':'历史授权');
 return '<section class="native-ai" aria-label="现有 AI 对话界面"><div class="native-header ai-header"><button class="back-button" data-native="list" aria-label="返回会话列表">'+icon('back')+'</button><div class="ai-identity"><div class="session-name">'+escape(c.name)+'</div><div class="session-meta">'+escape(c.agent)+' · '+escape(c.device)+' · TermLink</div></div><button class="cloud-control" data-native="menu" aria-label="AI 对话云朵菜单">'+icon('cloud')+'</button>'+cloudMenu(c)+'</div><nav class="ai-tools" aria-label="会话工具"><button data-panel="search">⌕ 搜索</button><button data-panel="files">▱ 文件</button><button data-panel="diff">± 变更</button><button data-panel="usage">用量</button></nav><div class="ai-panel hidden"></div><div class="ai-status'+(c.busy?'':' hidden')+'" role="status">● 正在回复（模拟）</div><div class="card-body chat" aria-label="AI 消息">'+sample(c)+c.lines.map(l=>lineHTML(c,l)).join('')+'</div><form class="composer ai-composer"><div class="attachment-chip'+(c.attachment?'':' hidden')+'"><span>＋ '+escape(c.attachment||'示例文件')+' · 演示引用</span><button type="button" data-native="remove-file">移除 ×</button></div><div class="ai-input-box"><textarea aria-label="向 '+escape(c.name)+' 输入" placeholder="'+(c.control===false?'请在云朵菜单重新确认连接':'输入消息…')+'" rows="2" maxlength="4000"'+(c.control===false?' disabled':'')+'>'+escape(c.draft)+'</textarea><div class="ai-compose-controls"><button type="button" class="icon-button" data-native="attach" aria-label="添加附件或引用"'+(c.control===false?' disabled':'')+'>'+icon('plus')+'</button><select class="permission-select" aria-label="授权方式"'+(c.control===false||c.busy?' disabled':'')+'>'+[modeLabel,...(claude?['计划模式','默认授权']:['历史授权','只读沙箱'])].filter((x,i,a)=>a.indexOf(x)===i).map(x=>'<option>'+escape(x)+'</option>').join('')+'</select><select class="model-select" aria-label="模型"'+(c.control===false||c.busy?' disabled':'')+'><option>'+escape(model)+'</option></select><select class="effort-select" aria-label="推理强度"'+(c.control===false||c.busy?' disabled':'')+'>'+[c.effort||(claude?'默认':'xhigh'),'low','medium','high'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>'<option>'+x+'</option>').join('')+'</select><button type="submit" class="icon-button send-button" aria-label="'+(c.busy?'停止生成':'发送消息')+'"'+(c.control===false?' disabled':'')+'>'+icon(c.busy?'stop':'send-original')+'</button></div></div><p class="history-grant">已沿用电脑历史会话的授权。请避免在原窗口同时发送消息。</p></form></section>';
}
function cardHTML(c) {
 return '<article class="session-card'+(c.id===selected?' active':'')+(c.wide?' wide':'')+(c.tall?' tall':'')+'" data-id="'+escape(c.id)+'" aria-label="'+escape(c.name)+'"><header class="card-header"><button class="drag-handle" data-action="drag" aria-label="拖动 '+escape(c.name)+'，Alt 加方向键排序" title="拖动窗口">'+icon('drag')+'</button><div class="window-kind">'+icon(c.type==='cli'?'terminal':c.brand)+'<span>'+c.type.toUpperCase()+'</span><span class="original-label">'+(c.type==='cli'?'终端':'对话')+'</span></div><span class="window-scale" aria-label="内容缩放比例">100%</span><div class="card-actions"><button class="icon-button" data-action="expand" aria-label="展开 '+escape(c.name)+'" title="展开 / Esc 返回">'+icon('max')+'</button><button class="icon-button" data-action="close" aria-label="收起 '+escape(c.name)+'" title="仅收起窗口，保留会话">'+icon('close')+'</button></div></header><div class="native-scale-viewport"><div class="native-scale-content">'+(c.type==='cli'?terminalView(c):aiView(c))+'</div></div><button class="resize-handle" data-action="resize" aria-label="调整 '+escape(c.name)+' 大小" title="拖动调整大小">'+icon('resize')+'</button></article>';
}
const pendingReplies=new Map();let prototypeClipboard='';
function send(c,form) {
 const input=form.querySelector('textarea'),text=input.value.trim();
 if(c.control===false||c.frozen)return;
 if(c.busy){if(c.type==='ai')stopReply(c);return;}
 if(!text)return;c.draft='';input.value='';
 if(c.type==='cli'&&text.toLowerCase()==='clear'){c.lines=[];c.cleared=true;form.closest('.terminal').querySelector('.output').innerHTML='';return;}
 c.lines.push({user:true,text});appendLine(c,c.lines.at(-1));c.busy=true;
 if(c.type==='ai')updateBusy(c);
 pendingReplies.set(c.id,setTimeout(()=>{
  pendingReplies.delete(c.id);
  const cmd=text.toLowerCase(),reply=c.type==='cli'?(cmd==='pwd'?'Path\n----\nC:\\Projects\\TermLink':cmd==='help'?'演示命令：pwd · clear · help\n输入只在此原型中模拟。':cmd==='hi'?'Hi!':text+'\n演示输出 · exit 0'):(cmd==='hi'?'Hi！可以继续对话。':'已收到「'+text.slice(0,100)+'」。\n这是沿用现有 AI 消息样式的本地模拟回复。');
  c.lines.push({user:false,text:reply});c.busy=false;appendLine(c,c.lines.at(-1));if(c.type==='ai')updateBusy(c);
 },650));
}
function updateBusy(c){const node=$('[data-id="'+c.id+'"]');if(!node)return;node.querySelector('.ai-status').classList.toggle('hidden',!c.busy);const b=node.querySelector('.send-button');b.innerHTML=icon(c.busy?'stop':'send-original');b.setAttribute('aria-label',c.busy?'停止生成':'发送消息');node.querySelectorAll('.ai-compose-controls select').forEach(s=>s.disabled=c.busy||c.control===false);}
function stopReply(c){clearTimeout(pendingReplies.get(c.id));pendingReplies.delete(c.id);c.busy=false;c.lines.push({user:false,text:c.type==='cli'?'^C':'已停止生成（演示）'});appendLine(c,c.lines.at(-1));if(c.type==='ai')updateBusy(c);}
function appendLine(c,line){const node=$('[data-id="'+c.id+'"]');if(!node||c.frozen)return;const body=node.querySelector('.card-body');(c.type==='cli'?body.querySelector('.output'):body).insertAdjacentHTML('beforeend',lineHTML(c,line));body.scrollTop=body.scrollHeight;}
function showSessions(){const picker=$('#session-picker');picker.innerHTML=cards.map(c=>'<button data-pick="'+escape(c.id)+'"><span class="agent-mark">'+icon(c.type==='cli'?'terminal':c.brand)+'</span><span class="identity"><span>'+escape(c.name)+'</span><small>'+escape(c.device)+' · '+escape(c.agent)+'</small></span><span class="picker-state">'+(c.hidden?'添加窗口':'已在工作台')+'</span></button>').join('');$('#sessions-dialog').showModal();}

 frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';
 stage.style.width=(width*scale+16)+'px';stage.style.height=(height*scale+16)+'px';
 document.getElementById('preview-status').textContent=width+' × '+height+' CSS px · '+(width>=height?'横屏':'竖屏')+' · '+Math.round(scale*100)+'% 预览';
 document.getElementById('rotate').textContent=portrait?'↻ 切换横屏':'↻ 切换竖屏';
 document.querySelectorAll('[data-ratio]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ratio===ratio)));
 document.getElementById('actual').setAttribute('aria-pressed',String(actual));
 document.getElementById('custom-form').classList.toggle('hidden',ratio!=='custom');
}
document.getElementById('ratios').addEventListener('click',e=>{const value=e.target.closest('[data-ratio]')?.dataset.ratio;if(value){ratio=value;resize();}});
document.getElementById('rotate').addEventListener('click',()=>{portrait=!portrait;resize();});
document.getElementById('actual').addEventListener('click',()=>{actual=!actual;resize();});
document.getElementById('custom-form').addEventListener('submit',e=>{e.preventDefault();const w=Number(document.getElementById('width').value),h=Number(document.getElementById('height').value);if([w,h].every(n=>Number.isFinite(n)&&n>=360&&n<=2560)){custom=[Math.round(w),Math.round(h)];portrait=false;resize();}});
new ResizeObserver(resize).observe(wrap);window.addEventListener('resize',resize);resize();
})();
