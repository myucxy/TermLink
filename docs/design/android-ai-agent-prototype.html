<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermLink · Android AI 会话交互提案</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--surface:#121820;--raised:#1b2430;--line:#2b3645;--text:#e9eef5;--muted:#aab5c5;--blue:#9cb2ff;--green:#65d6a1;--yellow:#f1c96b;--red:#ff8c91;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}

*{box-sizing:border-box}
body{margin:0;background:#090d12;color:var(--text)}
button,input,textarea,select{font:inherit}
button{color:inherit;border:0;cursor:pointer;background:none}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button svg{flex:none}
a{color:var(--blue)}
.shell{max-width:1736px;margin:0 auto;padding:42px 48px 28px}
.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--blue)}
h1{font-size:33px;letter-spacing:-.8px;margin:13px 0 10px;font-weight:650}
.intro{font-size:14px;color:var(--muted);line-height:1.8;margin:0;max-width:840px}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:center}
.badge{border:1px solid var(--line);border-radius:100px;padding:8px 12px;font-size:11px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;margin:25px 0 28px}
.toolbar button{padding:10px 17px;border-radius:9px;font-size:13px;color:var(--muted);border:1px solid var(--line)}
.toolbar button.active{color:var(--blue);background:#192238;border-color:#445785}
.toolbar .hint{margin-left:auto;font-size:12px;color:#8593a6}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;align-items:start}
.step-title{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:15px;font-weight:600}
.step-number{font-family:Consolas,monospace;font-size:12px;color:var(--blue);border:1px solid #354363;border-radius:6px;padding:4px 6px}
.phone{width:100%;max-width:368px;padding:7px;border:1px solid #3a4555;border-radius:34px;background:#111721;box-shadow:0 20px 42px #0005;margin:0 auto}
.screen{position:relative;background:var(--bg);height:806px;overflow:hidden;border-radius:27px;display:flex;flex-direction:column;font-size:13px;line-height:1.55}
.status{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 21px 0;font-size:11px;font-weight:600}
.system-icons{display:flex;gap:5px;align-items:center}
.status svg{width:13px;height:13px}
.gesture{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.gesture::after{content:"";height:4px;width:100px;border-radius:8px;background:#e9eef5b0}
.app-head{padding:17px 17px 12px;display:flex;align-items:center;gap:9px;min-height:67px}
.app-head h2{margin:0;font-size:24px;font-weight:650;letter-spacing:-.6px}
.app-head small{font-size:10px;color:var(--green)}
.spacer{flex:1}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--raised)}
svg{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.content{padding:0 14px 15px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#34445b transparent}
.muted{color:var(--muted)}
.tiny{font-size:10px}
.small{font-size:11px}
.label{font-size:11px;letter-spacing:.5px;color:var(--muted);margin:15px 0 9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:12px}
.device-head{display:flex;align-items:center;gap:10px}
.device-icon{width:35px;height:35px;background:#1d2942;border-radius:10px;color:var(--blue);display:grid;place-items:center}
.device-name{font-weight:650;font-size:14px}
.dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:5px}
.tag{display:inline-flex;align-items:center;border-radius:5px;font-size:10px;padding:2px 6px;color:var(--blue);background:#202d47;white-space:nowrap}
.tag.green{color:var(--green);background:#173129}
.tag.yellow{color:var(--yellow);background:#362f20}
.tag.neutral{color:var(--muted);background:var(--raised)}
.device-meta{display:flex;gap:7px;align-items:center;margin:11px 0;font-size:10px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.divider{height:1px;background:var(--line);margin:12px 0}
.session-row{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-height:48px;padding:6px 0;font-size:12px}
.session-row svg{width:17px;height:17px;color:var(--muted)}
.session-row small{font-size:10px;color:var(--muted)}
.session-row .session-main{flex:1;min-width:0}
.session-row .session-main>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:9px}
.btn{min-height:44px;border-radius:10px;padding:10px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:600;background:var(--raised);border:1px solid transparent}
.btn.primary{background:var(--blue);color:#14203d}
.btn.soft{background:#1c2946;color:#bacaff;border-color:#364a72}
.btn.outline{border-color:var(--line);background:transparent}
.btn.danger{color:var(--red);background:#2e1e29}
.btn.full{width:100%}
.btn svg{width:16px;height:16px}
.actions .btn{flex:1}
.bottom-nav{height:62px;flex:none;display:flex;background:var(--surface);border-top:1px solid #222c37}
.bottom-nav button{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;color:var(--muted)}
.bottom-nav button svg{width:20px;height:20px}
.bottom-nav button.active{color:var(--blue)}
.bottom-nav button.active .nav-icon{border-radius:15px;background:#26324d;padding:3px 18px}
.nav-icon{padding:3px 18px}
.helper{font-size:11px;color:var(--muted);line-height:1.8}
.foot-note{margin:15px 1px 0;font-size:12px;line-height:1.75;color:var(--muted)}
.foot-note strong{color:#d3dcf0;font-weight:500}
.shade{position:absolute;inset:32px 0 18px;background:#0009;z-index:2}
.sheet{position:absolute;bottom:18px;left:0;right:0;border:1px solid #384453;border-bottom:0;border-radius:24px 24px 0 0;background:#151d28;padding:9px 16px 20px;z-index:3;box-shadow:0 -10px 40px #0005}
.handle{width:34px;height:4px;margin:1px auto 12px;border-radius:8px;background:#536071}
.sheet h3{font-size:18px;margin:0 0 3px}
.sheet .icon-btn{margin:-6px -7px 0 0}
.segmented{display:flex;padding:4px;border-radius:10px;background:#0c121c;margin:15px 0 12px}
.segmented button{flex:1;min-height:38px;color:var(--muted);font-size:12px;border-radius:7px}
.segmented button.active{background:#293953;color:#d4dfff}
.agent-row{display:flex;align-items:center;gap:11px;width:100%;min-height:73px;padding:12px 0;border-bottom:1px solid #2b3543;text-align:left}
.agent-logo{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:14px;font-weight:700;letter-spacing:-1px;background:#253a36;color:#9de8cf}
.agent-logo.claude{background:#382d28;color:#dfaa8b;font-size:24px}
.agent-logo.grok{background:#2b303b;color:#e5e8ef;font-size:21px}
.agent-copy{flex:1}
.agent-copy strong{font-size:13px;font-weight:600}
.agent-copy small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.agent-row>svg{width:15px;height:15px;color:var(--muted)}
.text-btn{min-height:44px;font-size:12px;color:var(--blue);display:inline-flex;gap:6px;align-items:center}
.text-btn svg{width:15px;height:15px}
.notice{padding:10px 12px;border-radius:9px;font-size:11px;line-height:1.7;background:#202a3b;color:#c1cfee;margin:12px 0}
.notice.warn{background:#332e21;color:#f1d894}
.screen-head{height:61px;flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid #202a38}
.screen-head strong{font-size:16px}
.form-body{padding:17px 18px;flex:1;overflow:auto}
.provider-banner{display:flex;gap:11px;align-items:center;margin:1px 0 22px}
.provider-banner .agent-logo{width:42px;height:42px}
.field{margin:0 0 19px}
.field>label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}
.field-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid #364254;border-radius:10px;padding:11px 12px;min-height:47px;width:100%;text-align:left}
.path{font:11px/1.65 Consolas,"Microsoft YaHei",monospace;overflow-wrap:anywhere;color:#cfdaeb;flex:1}
.field-box svg{color:var(--blue);width:18px;height:18px}
.field select{width:100%;min-height:46px;border:1px solid #364254;border-radius:10px;background:var(--surface);color:var(--text);padding:9px;font-size:12px}
.field textarea{width:100%;height:92px;resize:none;outline:none;background:var(--surface);color:var(--text);padding:11px 12px;border:1px solid #364254;border-radius:10px;font-size:12px;line-height:1.8}
.form-footer{padding:12px 18px;background:var(--surface);border-top:1px solid var(--line)}
.form-footer .helper{text-align:center;margin-top:7px;font-size:10px}
.mini-tabs{height:36px;display:flex;align-items:center;gap:5px;padding:0 11px;border-bottom:1px solid var(--line);flex:none}
.mini-tabs button{font-size:10px;color:var(--muted);height:33px;padding:0 9px;border-radius:7px 7px 0 0}
.mini-tabs button.active{border-bottom:2px solid var(--blue);background:#1b2537;color:#ced9fa}
.chat-head{display:flex;align-items:center;padding:8px 11px;gap:7px;min-height:62px;flex:none;border-bottom:1px solid #26303c}
.chat-head .head-copy{flex:1;min-width:0}
.head-copy strong{font-size:14px}
.head-copy small{font-size:10px;color:var(--muted);display:block}
.cloud-btn{display:flex;gap:5px;align-items:center;min-height:44px;padding:0 6px;color:var(--blue);border-radius:10px;font-size:10px;white-space:nowrap}
.cloud-btn .cloud-inner{display:flex;gap:5px;align-items:center;padding:5px 7px;border:1px solid #34496b;border-radius:8px;background:#162135}
.cloud-btn svg{width:16px;height:16px}
.state-line{height:30px;display:flex;gap:6px;align-items:center;padding:0 14px;color:var(--yellow);font-size:10px;background:#242419;flex:none}
.state-line svg{width:12px;height:12px}
.chat-stream{flex:1;overflow:auto;padding:14px 13px;scrollbar-width:thin;scrollbar-color:#34445b transparent}
.user-bubble{background:#263650;border-radius:13px 13px 3px 13px;padding:10px 12px;font-size:12px;line-height:1.7;margin:0 0 16px 38px}
.assistant-byline{font-size:10px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.assistant-byline .agent-logo{height:21px;width:21px;border-radius:6px;font-size:10px}
.assistant-text{font-size:12px;line-height:1.85;margin:0 0 12px}
.tool-line{border:1px solid #2e3b4b;background:#141d28;border-radius:9px;padding:9px 10px;margin:8px 0;display:flex;align-items:center;gap:7px;font-size:10px}
.tool-line svg{width:14px;height:14px;color:var(--green)}
.tool-line .muted{margin-left:auto}
.approval{border:1px solid #7d6935;background:#201f19;border-radius:13px;padding:12px;margin:12px 0}
.approval-title{color:var(--yellow);font-size:12px;font-weight:650;display:flex;align-items:center;gap:7px}
.approval-title svg{width:16px;height:16px}
.approval p{font-size:11px;color:#ccd0d9;margin:8px 0}
.code{background:#0d121a;border:1px solid #333b42;padding:10px;border-radius:8px;font:11px/1.7 Consolas,monospace;color:#d5e1f7;overflow-wrap:anywhere;margin:9px 0}
.approval .actions{gap:6px}
.approval .actions .btn{padding:8px 5px;min-height:43px;font-size:11px}
.approval .actions .primary{flex:1.5}
.composer{padding:9px 12px 10px;background:var(--surface);border-top:1px solid #2c3849;flex:none}
.compose-box{padding:9px 11px;border:1px solid #3b485c;border-radius:12px;background:#0f151f}
.compose-box textarea{width:100%;border:0;color:var(--text);resize:none;background:transparent;min-height:37px;height:37px;font-size:12px;outline:none}
.compose-box textarea::placeholder{color:#8190a6}
.compose-actions{display:flex;align-items:center;gap:3px}
.compose-actions .icon-btn{min-width:34px;min-height:33px}
.compose-actions .icon-btn svg{width:17px;height:17px}
.send{width:34px;height:33px;border-radius:9px;background:var(--blue);color:#14203d;display:grid;place-items:center}
.compose-model{font-size:10px;color:var(--muted)}
.composer-note{font-size:9px;color:#8996a9;margin-top:5px;display:flex;justify-content:space-between}
.floating-menu{position:absolute;right:10px;top:122px;width:259px;border:1px solid #43516a;border-radius:14px;padding:7px;background:#1b2430;box-shadow:0 12px 32px #0008;z-index:4}
.menu-label{font-size:10px;color:#96a6bb;padding:5px 9px;letter-spacing:.3px}
.menu-item{width:100%;display:flex;align-items:center;gap:9px;min-height:44px;font-size:12px;padding:8px 9px;border-radius:7px;text-align:left}
.menu-item:hover{background:#2b374b}
.menu-item svg{width:16px;height:16px;color:#b6c6e2}
.menu-item small{margin-left:auto;color:var(--muted);font-size:10px}
.menu-separator{height:1px;background:#344050;margin:5px 7px}
.menu-item.danger{color:var(--red)}
.question{border:1px solid #40557e;background:#162036;border-radius:13px;padding:12px;margin:10px 0}
.question strong{font-size:12px}
.choice{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px;margin:8px 0;border:1px solid #384861;border-radius:9px;font-size:11px;cursor:pointer}
.choice:has(input:checked){border-color:var(--blue);background:#263855}
.choice input{accent-color:var(--blue);margin:0;width:14px;height:14px}
.choice small{display:block;font-size:10px;color:var(--muted)}
.question textarea{background:#0f1725;border:1px solid #364762;color:var(--text);border-radius:8px;width:100%;padding:9px;font-size:11px;resize:none;min-height:58px;margin:3px 0 10px}
.empty-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}
.empty-icon{width:66px;height:66px;border:1px solid #3f4b5f;border-radius:21px;background:#192130;display:grid;place-items:center;color:var(--muted);margin-bottom:18px}
.empty-icon svg{width:29px;height:29px}
.empty-body h3{font-size:18px;margin:0 0 10px}
.empty-body p{font-size:12px;color:var(--muted);line-height:1.9;margin:0 0 19px}
.empty-body .btn{min-width:168px}
.success-block{background:#142a24;border:1px solid #325b4c;border-radius:11px;padding:12px;margin-top:12px}
.success-block strong{color:var(--green);font-size:12px}
.toast{position:absolute;left:14px;right:14px;bottom:100px;border:1px solid #455779;padding:12px;background:#25334a;color:#e0e9fa;border-radius:10px;font-size:11px;z-index:9;box-shadow:0 6px 30px #0007}
.annotation-footer{display:flex;gap:28px;border-top:1px solid var(--line);padding-top:21px;margin-top:28px;color:var(--muted);font-size:12px;line-height:1.8}
.annotation-footer>div{flex:1}
.annotation-footer b{display:block;color:#d7e1f2;font-size:12px;margin-bottom:4px}
.prototype{display:grid;grid-template-columns:300px 368px minmax(200px,340px);gap:45px;justify-content:center;align-items:start}
.prototype .phone{width:368px}
.side-card{border:1px solid var(--line);border-radius:15px;background:#10161f;padding:20px}
.side-card h3{font-size:15px;margin:0 0 15px}
.side-card p,.side-card li{font-size:12px;color:var(--muted);line-height:1.9}
.side-card ul{padding-left:18px}
.scenario{display:block;width:100%;min-height:44px;text-align:left;padding:10px;border-radius:8px;color:var(--muted);font-size:12px;margin-bottom:4px}
.scenario:hover,.scenario.active{background:#22304a;color:#ccd9ff}
.side-tag{font-size:10px;color:var(--blue);margin:19px 0 9px}
.no-external{font-size:11px;color:#8192aa;margin-top:15px;line-height:1.8}
.keycap{border:1px solid #46526a;border-radius:5px;padding:1px 5px}
.hidden{display:none!important}
.working-dot{animation:pulse 1s infinite}
.draft-preserved{margin-top:22px;padding:11px;border:1px solid var(--line);border-radius:10px;width:100%;text-align:left;font-size:11px;color:var(--muted)}
@keyframes pulse{50%{opacity:.3}
}
@media(max-width:1300px){.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.prototype{grid-template-columns:230px 368px;gap:24px}
.prototype .side-card:last-child{display:none}
.shell{padding:30px}
.hero{align-items:flex-start}
}
@media(max-width:720px){.shell{padding:22px 14px}
.hero .badge,.toolbar .hint{display:none}
h1{font-size:26px}
.toolbar button{padding:10px;font-size:11px}
.board{grid-template-columns:1fr}
.step-title,.foot-note{max-width:368px;margin-left:auto;margin-right:auto}
.annotation-footer{display:block}
.annotation-footer>div{margin-bottom:14px}
.prototype{display:flex;flex-direction:column;align-items:center}
.prototype .side-card{width:100%;max-width:368px}
.prototype .side-card:first-child{order:2}
.prototype .phone{width:min(368px,100%)}
.screen{height:806px}
.intro{font-size:12px}
}


/* Keep the compact visuals inside full-size touch targets. */
.send{width:44px;height:44px}
.compose-actions .icon-btn{min-width:44px;min-height:44px}
.approval .actions .btn{min-height:44px}
.mini-tabs button{position:relative}
.mini-tabs button::before{content:"";position:absolute;inset:-4px 0}
.chat-stream{padding-top:10px;padding-bottom:8px}
.user-bubble{margin-bottom:12px}
.approval{padding:10px;margin-top:9px}
.approval .text-btn{min-height:30px}
.question p{margin:7px 0}
.question textarea{min-height:42px}
.tool-line{min-height:36px}


/* V2: separate destinations, with the original CLI body retained as a schematic. */
.nav-icon{position:relative;padding:3px 15px}.bottom-nav button.active .nav-icon{padding:3px 15px}
.nav-attention{position:absolute;width:6px;height:6px;right:10px;top:1px;background:var(--yellow);border-radius:50%;border:1px solid var(--surface)}
.type-caption{display:flex;align-items:center;justify-content:space-between;color:#93a4bb;font-size:10px;margin-top:12px;letter-spacing:.4px}
.ai-page-head{min-height:80px}.ai-page-head .btn{padding:8px 11px;min-height:40px}
.filter-row{display:flex;gap:7px;padding:0 15px 12px;flex:none}.filter-row button{font-size:11px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--muted)}
.filter-row button.active{background:#283651;color:#d6e0ff;border-color:#485b82}
.ai-card{display:block;width:100%;text-align:left;border:1px solid #334153;border-radius:14px;background:var(--surface);padding:14px;margin-bottom:12px}
.ai-card.attention{border-color:#6a5c38;background:linear-gradient(130deg,#1f231f,#131b25)}
.ai-card .agent-logo{width:29px;height:29px;font-size:12px;border-radius:9px}.ai-card .agent-logo.claude{font-size:19px}
.ai-card h3{font-size:15px;font-weight:600;margin:12px 0 7px}.ai-card p{font-size:11px;color:#b5c1d3;margin:0;line-height:1.8}
.ai-card .card-footer{border-top:1px solid #2a3543;margin-top:12px;padding-top:10px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.ai-card .card-footer strong{font-weight:500;color:var(--blue)}.ai-context{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);padding:8px 0}
.ai-context svg{width:13px;height:13px}.list-note{margin-top:17px;text-align:center;color:#92a1b6;font-size:11px;line-height:1.9}
.new-ai-callout{display:flex;align-items:center;gap:11px;padding:14px;border:1px dashed #42526e;border-radius:13px;width:100%;text-align:left;margin-top:16px}

const mainSteps=[['devices','设备 · 统一入口','查看电脑的全部会话，按 AI / CLI 类型进入对应栏目。'],['terminal','CLI · 原界面不变','直接引用原界面截图；布局、内容、页签与 Dock 均不改。'],['ai','AI · 紧凑对话列表','每项只保留标题、来源、状态与一行摘要，入口集中在右上角。'],['chat','AI · 内容优先','标题信息合并，输入栏单行起步，审批详情按需展开。']];

const preserveSteps=[['terminal','CLI · 原页面截图','保留原页面全部布局与内容。本次仅更改底部栏目名称。'],['cli-menu','CLI · 原菜单截图','引用已有截图，不设计新菜单；原功能继续完整保留。'],['device-menu','设备管理与文件保留','下载、文件、单个结束/删除、批量清理和长按操作继续保留。'],['settings','原设置完整保留','账号、主题、常亮、字体配色、快捷键与版本更新都保留。']];

function render(){
 document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===mode));
 const stage=document.getElementById('stage');
 if(mode==='interactive'){
  stage.innerHTML=`<div class="prototype"><aside class="side-card"><h3>紧凑 AI，CLI 原页面</h3><p>CLI 使用已有截图参照，不模拟或更改终端布局。点击 AI 体验新增交互。</p>${[['devices','设备'],['terminal','CLI 终端'],['ai','AI 对话列表'],['settings','设置'],['new-ai','新建 AI 对话']].map(([s,t])=>`<button class="scenario ${state.screen===s?'active':''}" data-action="${s}">${t}</button>`).join('')}<div class="side-tag">操作与状态</div>${[['open-codex','工具审批'],['question','问题回答'],['readonly','只读与获取控制权'],['offline','电脑离线'],['login','Agent 需要登录'],['unavailable','未发现 Agent'],['relay-only','只代理策略菜单'],['cli-menu','CLI 原菜单'],['device-menu','设备原菜单'],['reset','重置原型']].map(([s,t])=>`<button class="scenario" data-action="${s}">${t}</button>`).join('')}</aside>${frame(bodyFor(state.screen))}<aside class="side-card"><h3>新版信息结构</h3><ul><li>设备：电脑上的全部会话。</li><li>CLI：页面布局、内容、菜单、Dock 完全不改，只有底部名称变更。</li><li>AI：手机打开的结构化对话，列表进入详情，返回列表切换。</li><li>设置：账号、连接、外观与偏好。</li></ul><div class="side-tag">归类依据是会话类型</div><p>在终端里运行的 Codex 仍在 CLI；通过协议创建的 Codex 对话进入 AI。</p><p>新增按钮视觉紧凑并保留点击区域；旧功能不删减。原 CLI 截图来自仓库历史验证记录，不代表本轮运行状态。</p><p class="no-external">所有内容为设计演示，不会启动程序、连接网络或修改产品数据。</p></aside></div>`;
 }else{
  const steps=mode==='preserve'?preserveSteps:mode==='states'?otherSteps:mode==='create'?createSteps:mainSteps;
  const oldOrigin=state.origin;if(mode==='create')state.origin='ai';
  stage.innerHTML=`<div class="board">${steps.map(([s,title,note],i)=>`<section><h2 class="step-title"><span class="step-number">${String(i+1).padStart(2,'0')}</span>${title}</h2>${frame(bodyFor(s))}<p class="foot-note">${note}</p></section>`).join('')}</div><div class="annotation-footer"><div><b>设备 / CLI / AI / 设置</b>设备看全部，CLI 与 AI 各自只保留手机打开的会话。</div><div><b>CLI 不改布局 · AI 紧凑布局</b>CLI 页面完全保留，AI 压缩工具栏与重复信息。</div><div><b>切换保留状态 · 内容来自电脑</b>新功能不覆盖旧设置；切换栏目不重建既有会话。</div></div>`;
  state.origin=oldOrigin;
 }
}
let toastTimer;
function toast(text){state.toast=text;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},2600);}
function reset(){clearTimeout(toastTimer);Object.assign(state,{codexDecision:null,cliControl:true,touchMouse:false,wheelLeft:false,aiLast:'ai',origin:'devices',filter:'all',cliTab:'PowerShell',cliDraft:'',opened:['Codex','Claude Code'],title:'设备列表刷新',first:'分析项目，修复设备列表刷新问题',permission:'ask',screen:'devices',provider:'Codex',tab:'ai',choice:'minimal',approved:false,rejected:false,readonly:false,relayOnly:false,questionDone:false,answer:'',draft:'',busy:false,scan:false,scanned:false,sent:[],toast:''});}
async function action(name,el){if(mode!=='interactive'){const previousMode=mode;mode='interactive';state.origin=previousMode==='create'?'ai':'devices';}
switch(name){

case 'reset':reset();break;
case 'nav-devices':state.screen='devices';break;
case 'nav-cli':case 'terminal':state.screen='terminal';break;
case 'nav-ai':state.screen=state.aiLast;break;
case 'nav-settings':case 'settings':state.screen='settings';break;
case 'new-device':state.origin='devices';state.tab='ai';state.screen='picker';break;
case 'new-ai':state.origin='ai';state.tab='ai';state.screen='picker';break;
case 'new-cli':state.origin='devices';state.tab='terminal';state.screen='picker';break;
case 'picker-back':state.screen=state.origin==='ai'?'ai':'devices';break;
case 'choose-pc':state.screen='choose-pc';break;
case 'pc-home':state.screen='picker';break;
case 'pc-other':state.screen='unavailable';break;
case 'filter-all':state.filter='all';state.screen='ai';break;
case 'filter-attention':state.filter='attention';state.screen='ai';break;
case 'cli-codex':state.cliTab='Codex CLI';state.screen='terminal';break;
case 'cli-powershell':state.cliTab='PowerShell';state.screen='terminal';break;

case 'cli-menu':state.screen='cli-menu';break;
case 'cli-control':state.cliControl=!state.cliControl;state.screen='cli-menu';break;
case 'cli-mouse':state.touchMouse=!state.touchMouse;state.screen='cli-menu';break;
case 'cli-wheel':state.wheelLeft=!state.wheelLeft;state.screen='cli-menu';break;
case 'cli-resize':toast('保留原功能：按收起输入法后的视口、字体与 Dock 行数调整');return;
case 'cli-restore':toast('保留原功能：恢复电脑窗口尺寸');return;
case 'downloads':toast('下载中心入口保持原位置与原有功能');return;
case 'cleanup-demo':toast('保留原批量清理确认、Windows 校验与逐项结果；演示不执行删除');return;
case 'stop-demo':toast('保留原单个会话操作及确认：在线结束，失效记录删除');return;

case 'cli-key':toast('CLI 按键示意；正式版保留原有终端输入逻辑');return;
case 'open-codex':state.provider='Codex';state.approved=state.codexDecision==='approve';state.rejected=state.codexDecision==='reject';state.readonly=false;state.screen='chat';if(!state.opened.includes('Codex'))state.opened.push('Codex');break;

case 'select':state.provider=el.dataset.provider;state.screen='setup';break;
case 'ai-tab':state.tab='ai';state.screen='picker';break;
case 'terminal-tab':state.tab='terminal';state.screen='picker';break;
case 'create':if(state.busy)return;state.busy=true;render();setTimeout(()=>{state.busy=false;state.approved=state.permission==='read';state.rejected=false;state.readonly=false;state.screen='chat';state.aiLast='chat';if(!state.opened.includes(state.provider))state.opened.push(state.provider);render();},650);return;
case 'approve':case 'reject':if(state.readonly||state.approved||state.rejected)return;state.approved=name==='approve';state.rejected=name==='reject';if(state.provider==='Codex')state.codexDecision=name;state.screen='chat';break;
case 'answer':if(state.readonly||state.questionDone)return;state.questionDone=true;if(!state.answer.trim())state.answer=state.choice==='minimal'?'保留现有页面，修复刷新问题。':'同时调整列表布局。';break;
case 'readonly':state.readonly=true;state.screen='chat';break;
case 'take-control':state.readonly=false;state.screen='chat';toast('已获取控制权限 · 电脑已确认');return;
case 'relay-only':state.relayOnly=true;state.screen='menu';break;
case 'menu':state.screen='menu';break;
case 'reconnect':state.screen='chat';toast('HOME-PC 已恢复在线 · 已同步会话状态');return;
case 'scan':if(state.scan)return;state.scan=true;render();setTimeout(()=>{state.scan=false;state.scanned=true;toast(state.screen==='login'?'检测完成：Grok Build 仍需在 HOME-PC 上登录':'检测完成：Codex、Claude 可用；Grok 需登录');},700);return;
case 'folder':state.folder='E:\\WorkSpace\\AICodeProject\\'+el.dataset.folder;state.screen='setup';break;
case 'send':if(state.readonly)return;if(!state.draft.trim()){toast('请先输入消息');return;}state.sent.push(state.draft.trim());state.draft='';state.approved=true;break;
case 'claude-chat':state.provider='Claude Code';state.approved=true;state.rejected=false;state.readonly=false;state.screen='chat';if(!state.opened.includes('Claude Code'))state.opened.push('Claude Code');break;
case 'close-view':state.opened=state.opened.filter(p=>p!==state.provider);state.screen='ai';state.aiLast='ai';state.filter='all';toast('对话视图已关闭 · 电脑会话继续运行');return;
case 'keyboard':document.querySelector('.compose-box textarea')?.focus();return;
case 'network':toast(state.relayOnly?'当前策略：只使用服务端中转 · 连接正常':'当前使用服务端中转 · 可单独测试 LAN / NAT');return;
case 'test-lan':toast('LAN 测试完成：此示例网络无法直连，继续使用中转');return;
case 'test-nat':toast('NAT 测试完成：此示例网络未建立直连，继续使用中转');return;
case 'approval-detail':toast('本次请求：运行测试 · HOME-PC · 当前 Codex 会话');return;
case 'tool-detail':toast('已读取：设备目录、会话状态、列表刷新代码');return;
case 'diff':toast('修改预览：状态同步与列表刷新，共 2 个文件');return;
case 'refresh-devices':toast('已从在线电脑同步会话与能力');return;
case 'session-detail':toast(`${state.provider} · HOME-PC · TermLink · 按需审批`);return;
case 'files':toast('此入口继续使用现有文件浏览页面');return;
case 'attachment':toast('附件入口按当前 Agent 支持的类型显示');return;
case 'settings-info':toast('此设置入口示意；Agent 路径与登录在 Windows 管理');return;
default:state.screen=name;}
if(['ai','chat','question','offline','ended'].includes(state.screen))state.aiLast=state.screen;
render();}
document.addEventListener('click',event=>{const view=event.target.closest('[data-view]');if(view){mode=view.dataset.view;reset();render();return;}const el=event.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el);});
document.addEventListener('input',event=>{if(event.target.dataset.input==='cli-draft')state.cliDraft=event.target.value;if(event.target.dataset.input==='first')state.first=event.target.value;if(event.target.dataset.input==='draft'){state.draft=event.target.value;event.target.style.height='46px';event.target.style.height=Math.min(110,Math.max(46,event.target.scrollHeight))+'px';}if(event.target.dataset.input==='answer')state.answer=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='permission')state.permission=event.target.value;if(event.target.name==='approach')state.choice=event.target.value;});
render();
// Small browser check for the actual prototype flow and conditional controls.

async function selftest(){
 const assert=(value,message)=>{if(!value)throw Error(message);};
 const active=()=>document.querySelector('.bottom-nav .active')?.getAttribute('aria-label');
 mode='interactive';reset();render();
 assert([...document.querySelectorAll('.bottom-nav button')].map(b=>b.getAttribute('aria-label')).join('|')==='设备|CLI|AI|设置','four destinations');
 await action('nav-cli',document.body);assert(active()==='CLI','CLI selected');
 assert(document.querySelector('.cli-reference img').getAttribute('src')==='cli-existing-body.png','original CLI screenshot');assert(!document.querySelector('.cli-dock')&&!document.querySelector('.cli-input'),'CLI is not redrawn');
 await action('nav-ai',document.body);assert(state.screen==='ai'&&active()==='AI','AI list destination');
 await action('cli-menu',document.body);assert(document.querySelector('.cli-reference img').getAttribute('src')==='cli-existing-menu.png','original CLI menu screenshot');await action('open-codex',document.body);state.draft='保留 AI 草稿';assert(!document.querySelector('.mini-tabs'),'AI has no terminal tabs');
 await action('nav-cli',document.body);assert(document.querySelector('.cli-reference img').getAttribute('src')==='cli-existing-body.png','CLI reference retained');
 await action('nav-ai',document.body);assert(state.screen==='chat'&&state.draft==='保留 AI 草稿','AI state retained');
 await action('ai',document.body);await action('new-ai',document.body);assert(state.origin==='ai'&&document.querySelector('.picker-pc'),'AI create entry');
 await action('select',{dataset:{provider:'Claude Code'}});assert(state.screen==='setup'&&state.provider==='Claude Code','provider selection');
 assert(document.querySelector('.field-box').getBoundingClientRect().width>250,'form width');assert(document.querySelector('.form-two').children.length===2,'compact form');
 await action('create',document.body);await new Promise(r=>setTimeout(r,750));assert(state.screen==='chat'&&!state.busy&&active()==='AI','create enters AI');
 await action('approve',document.body);assert(state.approved&&!document.querySelector('[data-action="approve"]'),'approval consumed');
 state.approved=false;await action('readonly',document.body);assert(document.querySelector('[data-action="approve"]').disabled,'read-only approval');
 await action('take-control',document.body);assert(!state.readonly,'control restored');
 await action('relay-only',document.body);assert(!document.querySelector('[data-action="test-nat"]')&&!document.querySelector('[data-action="test-lan"]'),'relay-only menu');
 await action('offline',document.body);assert(!document.querySelector('.chat-stream')&&!document.querySelector('[data-action="send"]'),'offline hides transcript');
 state.screen='question';render();assert(!document.querySelector('.compose-box'),'question has one input area');
 await action('answer',document.body);assert(state.questionDone&&!document.querySelector('[data-action="answer"]'),'question consumed');
 const provider=state.provider;await action('close-view',document.body);assert(state.screen==='ai'&&!state.opened.includes(provider),'close isolated to AI');
 await action('nav-settings',document.body);assert(active()==='设置','settings destination');assert(document.querySelector('.settings-list').textContent.includes('终端快捷键'),'settings retained');await action('device-menu',document.body);assert(document.querySelector('[data-action="cleanup-demo"]'),'batch cleanup retained');
 clearTimeout(toastTimer);mode='create';reset();render();assert(document.querySelector('.field-box').getBoundingClientRect().width>250,'overview form layout');
 assert([...document.querySelectorAll('.screen')].every(s=>s.scrollWidth<=s.clientWidth+1),'screen overflow');
 mode='overview';render();const viewport=document.querySelector('.chat-stream').getBoundingClientRect().height;assert(viewport>520,'compact conversation space');
 const result=document.getElementById('test-result');result.classList.remove('hidden');result.textContent='SELFTEST PASS: four tabs, original CLI references, retained AI draft, retained controls, creation, approval, control, policy, offline, question, layout';result.dataset.status='pass';result.dataset.chatViewport=String(Math.round(viewport));
}
if(new URLSearchParams(location.search).has('selftest'))selftest().catch(e=>{const result=document.getElementById('test-result');result.classList.remove('hidden');result.dataset.status='fail';result.textContent='SELFTEST FAIL: '+e.message;});
</script>
