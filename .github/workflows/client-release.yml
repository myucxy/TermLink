name: Build clients from tag
run-name: Client build ${{ github.ref_name }} ${{ inputs.version }} ${{ inputs.build }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for signing rehearsal only
        required: true
        default: '0.3.18'
        type: string
      build:
        description: Build for signing rehearsal only
        required: true
        default: '148'
        type: string
      platform:
        description: Scope of the signing rehearsal
        type: choice
        default: all
        options: [all, macos]

permissions:
  contents: read

concurrency:
  group: github-client-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.event.created && !github.event.deleted && !github.event.forced)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Resolve client version and source
        env:
          TEST_VERSION: ${{ inputs.version }}
          TEST_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$revision" origin/main
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$TEST_VERSION"
            build="$TEST_BUILD"
          else
            ref="refs/tags/$GITHUB_REF_NAME"
            [[ $(git cat-file -t "$ref") == tag && $(git rev-parse "$ref^{commit}") == "$revision" ]]
            version="${GITHUB_REF_NAME#v}"
            annotation=$(git for-each-ref --format='%(contents:subject)' "$ref")
            [[ "$annotation" == build=* ]]
            build="${annotation#build=}"
          fi
          part='(0|[1-9][0-9]{0,4})'
          [[ "$version" =~ ^${part}\.${part}\.${part}$ && "$build" =~ ^[1-9][0-9]{0,4}$ ]]
          ((build <= 65535))
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ $(printf '%s\n' 0.3.18 "$version" | sort -V | tail -n1) == "$version" && "$version" != 0.3.18 ]]
            ((build > 148))
          fi
          printf 'version=%s\nbuild=%s\nrevision=%s\n' "$version" "$build" "$revision" >> "$GITHUB_OUTPUT"

  core-source:
    if: github.event_name == 'push' || inputs.platform == 'all'
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write # GitHub requires this scope to read a draft asset.
    outputs:
      artifact_id: ${{ steps.core.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - name: Retrieve and verify pinned core source bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_release.py fetch-core-source --directory "$RUNNER_TEMP/core-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: core
        with:
          name: pinned-core-source
          path: ${{ runner.temp }}/core-source/core-source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    needs: [identity, core-source]
    runs-on: windows-2025
    timeout-minutes: 70
    environment: github-client-signing
    env:
      CLIENT_VERSION: ${{ needs.identity.outputs.version }}
      CLIENT_BUILD: ${{ needs.identity.outputs.build }}
      CLIENT_REVISION: ${{ needs.identity.outputs.revision }}
    outputs:
      artifact_id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/termlink-dotnet
        with:
          dotnet-version: '8.0.303'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-source.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-core-source
      - name: Prepare Windows and Android build tools
        shell: pwsh
        run: ./scripts/build-github-clients.ps1 -Version $env:CLIENT_VERSION -BuildNumber $env:CLIENT_BUILD -PrepareOnly
      - name: Build and validate signed APK and Setup
        shell: pwsh
        env:
          GH_CLIENT_ANDROID_KEYSTORE_B64: ${{ secrets.GH_CLIENT_ANDROID_KEYSTORE_B64 }}
          GH_CLIENT_ANDROID_PASSWORD: ${{ secrets.GH_CLIENT_ANDROID_PASSWORD }}
          GH_CLIENT_WINDOWS_PFX_B64: ${{ secrets.GH_CLIENT_WINDOWS_PFX_B64 }}
          GH_CLIENT_WINDOWS_PASSWORD: ${{ secrets.GH_CLIENT_WINDOWS_PASSWORD }}
        run: ./scripts/build-github-clients.ps1 -Version $env:CLIENT_VERSION -BuildNumber $env:CLIENT_BUILD
      - name: Generate matching corresponding source and verify the complete batch
        shell: pwsh
        run: |
          $dir = "artifacts/release/$env:CLIENT_VERSION-$env:CLIENT_BUILD"
          $source = "$dir/TermLink-$env:CLIENT_VERSION-$env:CLIENT_BUILD-source.zip"
          $core = Get-Content -Raw release/github-client-core-source.json | ConvertFrom-Json
          $coreArchive = Join-Path $env:RUNNER_TEMP 'verified-core-source/core-source.zip'
          ./scripts/New-CorrespondingSourceArchive.ps1 -ApplicationRepository . `
            -Version $env:CLIENT_VERSION -BuildNumber $env:CLIENT_BUILD -ApplicationRevision $env:CLIENT_REVISION `
            -ArtifactManifestPath "$dir/artifact-manifest.json" -OutputPath $source `
            -CoreSourceArchivePath $coreArchive -CoreSourceArchiveSha256 $core.archive_sha256
          python scripts/github_release.py verify-bundle --directory $dir
          if ($LASTEXITCODE -ne 0) { throw 'Client release bundle verification failed.' }
      - name: Preserve the exact verified bytes for publication retry
        if: github.event_name == 'push'
        id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-release-assets
          path: artifacts/release/${{ env.CLIENT_VERSION }}-${{ env.CLIENT_BUILD }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  package-macos:
    needs: identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    environment: github-macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    env:
      CLIENT_VERSION: ${{ needs.identity.outputs.version }}
      CLIENT_BUILD: ${{ needs.identity.outputs.build }}
      CLIENT_REVISION: ${{ needs.identity.outputs.revision }}
      CLIENT_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/termlink-dotnet
        with:
          dotnet-version: '8.0.303'
      - name: Prepare and verify the pinned macOS Protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          curl --fail --location --retry 3 --output "$archive" https://github.com/protocolbuffers/protobuf/releases/download/v33.6/protoc-33.6-osx-universal_binary.zip
          printf '%s  %s\n' 988cbd03f38013ee833c6a12544a965739345924735d45fc2f0ba96c5973fce6 "$archive" | shasum -a 256 --check
          unzip -q "$archive" bin/protoc -d "$RUNNER_TEMP/protoc"
          protoc="$RUNNER_TEMP/protoc/bin/protoc"
          "$protoc" --version
          printf 'TERMLINK_PROTOC=%s\n' "$protoc" >> "$GITHUB_ENV"
          [[ $("$DOTNET_ROOT/dotnet" --version) == 8.0.303 ]]
      - name: Build and verify the self-signed macOS app
        shell: bash
        env:
          GH_MACOS_SIGNING_P12_B64: ${{ secrets.GH_MACOS_SIGNING_P12_B64 }}
          GH_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.GH_MACOS_SIGNING_P12_PASSWORD }}
        run: bash scripts/build-github-macos.sh
      - name: Keep the verified macOS package for the tag release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-macos-${{ matrix.rid }}
          path: ${{ runner.temp }}/macos-release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  assemble:
    if: github.event_name == 'push'
    needs: [identity, package, package-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.combined.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: artifacts/github-client-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: client-macos-osx-*
          merge-multiple: true
          path: artifacts/github-client-assets
      - name: Verify complete release with both macOS architectures
        run: python3 scripts/github_release.py verify-bundle --directory artifacts/github-client-assets --with-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: combined
        with:
          name: verified-client-release-assets
          path: artifacts/github-client-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    concurrency:
      group: github-client-stable-publication
      cancel-in-progress: false
    needs: [identity, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: artifacts/github-client-assets
      - name: Publish the signed client release
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_REVISION: ${{ needs.identity.outputs.revision }}
        run: python3 scripts/github_release.py publish-tag --directory artifacts/github-client-assets --tag "$GITHUB_REF_NAME" --revision "$CLIENT_REVISION" --with-macos
